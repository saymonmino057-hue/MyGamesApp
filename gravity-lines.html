<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravity Lines — 2000 Levels</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial;background:#07111f;color:#fff}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(1100px,100vw);height:min(760px,100vh);overflow:hidden;background:radial-gradient(circle at 70% 20%,rgba(70,150,255,.18),transparent 28%),radial-gradient(circle at 20% 75%,rgba(170,70,255,.15),transparent 30%),linear-gradient(145deg,#07111f,#0b1930 55%,#10172c);border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 90px rgba(0,0,0,.5)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
.card{padding:10px 15px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(9,20,38,.72);backdrop-filter:blur(12px)}
.card small{display:block;color:#8fa8c8;font-size:10px;letter-spacing:2px}.card b{font-size:20px}.spacer{flex:1}
button{pointer-events:auto;border:0;border-radius:14px;padding:12px 17px;font-weight:800;color:white;background:linear-gradient(135deg,#4e8cff,#9d54ff);cursor:pointer;box-shadow:0 8px 24px rgba(90,110,255,.25)}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;padding:10px 16px;border-radius:999px;background:rgba(8,18,34,.72);border:1px solid rgba(255,255,255,.12);color:#9db4d1;font-size:12px;letter-spacing:1.5px;text-align:center;white-space:nowrap}
#modal{position:absolute;inset:0;z-index:10;display:none;place-items:center;background:rgba(2,7,16,.62);backdrop-filter:blur(8px)}
#modal.show{display:grid}.panel{width:min(440px,90%);padding:34px;text-align:center;border-radius:26px;background:linear-gradient(145deg,rgba(20,35,62,.96),rgba(10,18,35,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px rgba(0,0,0,.5)}
.panel h1{margin:0 0 8px;font-size:38px}.panel p{color:#9fb3cf;line-height:1.6}
@media(max-width:650px){.hud{gap:6px}.card{padding:8px 10px}.card b{font-size:16px}.card small{font-size:8px}.hud button{padding:9px 11px}#hint{font-size:10px;bottom:9px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div class="hud">
<div class="card"><small>LEVEL</small><b id="level">1 / 2000</b></div>
<div class="card"><small>BALLS</small><b id="balls">0 / 5</b></div>
<div class="card"><small>LINES</small><b id="lines">0</b></div>
<div class="spacer"></div><button id="restart">RESTART</button>
</div>
<div id="hint">DRAW A LINE • RELEASE • THE BALLS FALL • GUIDE ALL 5 INTO THE CRYSTAL</div>
<div id="modal"><div class="panel"><h1 id="modalTitle">LEVEL COMPLETE!</h1><p id="modalText"></p><button id="modalBtn">NEXT LEVEL</button></div></div>
</div>
<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),wrap=document.getElementById("wrap");
const levelEl=document.getElementById("level"),ballsEl=document.getElementById("balls"),linesEl=document.getElementById("lines");
const modal=document.getElementById("modal"),modalTitle=document.getElementById("modalTitle"),modalText=document.getElementById("modalText"),modalBtn=document.getElementById("modalBtn");
let W,H,dpr,level=+localStorage.getItem("gravityLevel")||1,balls=[],lines=[],particles=[],stars=[],target={},drawing=false,currentLine=[],released=false,completed=0,last=performance.now();
const colors=["#6ee7ff","#a78bfa","#7cffb2","#ffd166","#ff77c8"];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.2,a:Math.random()*.7+.2,s:Math.random()*1.5+.2}));}
function cfg(){let d=Math.min(level-1,1999);return{gravity:650+d*.035,wind:Math.sin(d*.17)*18,maxLines:Math.min(2+Math.floor(d/180),7),targetR:Math.max(22,31-d*.002)}}
function starts(){let a=[];for(let i=0;i<5;i++){let p,t=0;do{p={x:rand(60,W-60),y:rand(100,H*.4)};t++}while(a.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<75)&&t<100);a.push(p)}return a}
function reset(){let c=cfg();balls=[];lines=[];particles=[];currentLine=[];drawing=false;released=false;completed=0;target={x:rand(W*.62,W-65),y:rand(H*.24,H*.78),r:c.targetR};starts().forEach((p,i)=>balls.push({x:p.x,y:p.y,vx:rand(-25,25),vy:0,r:13,active:true,color:colors[i]}));modal.classList.remove("show");hud()}
function hud(){levelEl.textContent=`${level} / 2000`;ballsEl.textContent=`${completed} / 5`;linesEl.textContent=lines.length}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{if(modal.classList.contains("show"))return;drawing=true;currentLine=[pos(e)];canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;let p=pos(e),q=currentLine[currentLine.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>7)currentLine.push(p)});
canvas.addEventListener("pointerup",()=>{if(!drawing)return;drawing=false;if(currentLine.length>1){let p=[currentLine[0]];for(let i=1;i<currentLine.length;i++){let a=p[p.length-1],b=currentLine[i];if(Math.hypot(a.x-b.x,a.y-b.y)>8)p.push(b)}if(p.length>1){lines.push(p);if(lines.length>cfg().maxLines)lines.shift();released=true;balls.forEach(b=>b.vy+=25);hud()}}currentLine=[]});
document.getElementById("restart").onclick=reset;
modalBtn.onclick=()=>{level=level>=2000?1:level+1;localStorage.setItem("gravityLevel",level);reset()};
function seg(px,py,ax,ay,bx,by){let dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);let x=ax+t*dx,y=ay+t*dy;return{x,y,d:Math.hypot(px-x,py-y)}}
function hit(b,a,c){let q=seg(b.x,b.y,a.x,a.y,c.x,c.y),md=b.r+3;if(q.d>md)return;let nx=b.x-q.x,ny=b.y-q.y,n=Math.hypot(nx,ny);if(n<.001){nx=-(c.y-a.y);ny=c.x-a.x;n=Math.hypot(nx,ny)||1}nx/=n;ny/=n;b.x=q.x+nx*(b.r+4);b.y=q.y+ny*(b.r+4);let vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=2*vn*nx*.82;b.vy-=2*vn*ny*.82;burst(q.x,q.y,b.color,5)}}
function update(dt){let c=cfg();for(let b of balls){if(!b.active)continue;if(released){b.vy+=c.gravity*dt;b.vx+=c.wind*dt*.05;b.x+=b.vx*dt;b.y+=b.vy*dt}else b.vy+=Math.sin(performance.now()/450+b.x)*2*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.75}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.75}
for(let path of lines)for(let i=1;i<path.length;i++)hit(b,path[i-1],path[i]);
if(Math.hypot(b.x-target.x,b.y-target.y)<b.r+target.r*.78){b.active=false;completed++;burst(target.x,target.y,b.color,34);hud();if(completed===5)finish()}
if(b.y>H+40){b.x=rand(55,W-55);b.y=rand(75,H*.28);b.vx=rand(-40,40);b.vy=0}}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;p.size*=.992}particles=particles.filter(p=>p.life>0)}
function finish(){released=false;modalTitle.textContent=level===2000?"YOU BEAT ALL 2000 LEVELS!":"LEVEL COMPLETE!";modalText.textContent=level===2000?"Amazing! All five balls reached the crystal on level 2000.":"All 5 balls reached the crystal. Continue to the next level.";modalBtn.textContent=level===2000?"PLAY AGAIN":"NEXT LEVEL";modal.classList.add("show")}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(50,280);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:250,life:rand(.35,.9),size:rand(2,5),color})}}
function bg(t){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#06101f");g.addColorStop(.55,"#0a1b32");g.addColorStop(1,"#11122a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*s.s*.002+s.x));ctx.fillStyle="#dff3ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function targetDraw(t){let p=1+Math.sin(t*.004)*.08;ctx.save();ctx.translate(target.x,target.y);ctx.scale(p,p);ctx.shadowBlur=28;ctx.shadowColor="#65c7ff";ctx.strokeStyle="#8de3ff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,target.r,0,7);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,target.r*.68,0,7);ctx.stroke();ctx.rotate(t*.0005);ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=i%2?target.r*.45:target.r*.8;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.stroke();ctx.fillStyle="#9deaff";ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.restore()}
function lineDraw(path){if(path.length<2)return;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";for(let [w,c,blur] of [[13,"rgba(90,170,255,.28)",18],[5,"#69b5ff",8],[1.5,"rgba(230,248,255,.9)",0]]){ctx.shadowBlur=blur;ctx.shadowColor="#53a7ff";ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke()}ctx.restore()}
function ballDraw(b){ctx.save();ctx.translate(b.x,b.y);ctx.shadowBlur=25;ctx.shadowColor=b.color;let g=ctx.createRadialGradient(-4,-5,2,0,0,b.r);g.addColorStop(0,"#fff");g.addColorStop(.18,b.color);g.addColorStop(1,"rgba(30,80,160,.9)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(-4,-5,3,0,7);ctx.fill();ctx.restore()}
function draw(t){bg(t);targetDraw(t);lines.forEach(lineDraw);if(drawing)lineDraw(currentLine);balls.forEach(b=>b.active&&ballDraw(b));for(let p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
function loop(now){let dt=Math.min(.032,(now-last)/1000);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
window.addEventListener("resize",resize);resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
