<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Liquid Sort — 3000 Levels</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 10%,rgba(80,110,255,.25),transparent 28%),
        radial-gradient(circle at 85% 10%,rgba(190,70,255,.2),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(0,220,180,.12),transparent 35%),
        #080b15;
}

.app{
    width:min(1250px,100%);
    margin:auto;
    padding:22px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:56px;
    height:56px;
    display:grid;
    place-items:center;
    border-radius:18px;
    font-size:29px;
    background:linear-gradient(135deg,#587dff,#a14cff);
    box-shadow:0 15px 45px rgba(90,100,255,.35);
}

h1{
    margin:0;
    font-size:25px;
    letter-spacing:1px;
}

.subtitle{
    margin-top:4px;
    color:#818ba5;
    font-size:10px;
    letter-spacing:3px;
}

.stats{
    display:flex;
    gap:9px;
}

.stat{
    min-width:90px;
    padding:10px 14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
}

.stat small{
    display:block;
    color:#7f89a3;
    font-size:9px;
    text-transform:uppercase;
}

.stat strong{
    display:block;
    margin-top:4px;
    font-size:19px;
}

.controls{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:13px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
}

.controls-left,
.controls-right{
    display:flex;
    gap:9px;
}

button,
select{
    font:inherit;
}

button{
    padding:10px 15px;
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:rgba(255,255,255,.07);
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.14);
}

button:active{
    transform:scale(.96);
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.primary{
    background:linear-gradient(135deg,#5d7fff,#9d52ff);
    box-shadow:0 12px 35px rgba(90,90,255,.3);
}

select{
    padding:10px 13px;
    color:#fff;
    background:#171c2d;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    outline:none;
}

.game{
    position:relative;
    min-height:650px;
    padding:55px 15px 80px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:30px;
    background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.07),transparent 45%),
        rgba(255,255,255,.025);
    box-shadow:
        inset 0 1px rgba(255,255,255,.07),
        0 30px 90px rgba(0,0,0,.35);
}

.difficulty{
    position:absolute;
    top:18px;
    left:0;
    right:0;
    text-align:center;
    color:#858fa8;
    font-size:10px;
    letter-spacing:2px;
}

.difficulty span{
    color:#b6bfd6;
}

.board{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    gap:35px 25px;
}

.tube-wrap{
    position:relative;
    width:75px;
    height:350px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    cursor:pointer;
    transition:transform .25s;
}

.tube-wrap:hover{
    transform:translateY(-7px);
}

.tube-wrap.selected{
    transform:translateY(-18px);
}

.tube-wrap.selected .tube{
    border-color:#8da5ff;
    box-shadow:
        0 0 0 5px rgba(100,125,255,.08),
        0 0 45px rgba(100,125,255,.45),
        inset 8px 0 20px rgba(255,255,255,.08);
}

.tube{
    position:relative;
    width:66px;
    height:290px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.28);
    border-radius:13px 13px 30px 30px;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.025) 35%,
            rgba(255,255,255,.04) 70%,
            rgba(255,255,255,.13)
        );
    box-shadow:
        inset 8px 0 20px rgba(255,255,255,.07),
        inset -8px 0 20px rgba(0,0,0,.16),
        0 20px 45px rgba(0,0,0,.4);
}

.tube:before{
    content:"";
    position:absolute;
    z-index:20;
    left:8px;
    top:8px;
    bottom:20px;
    width:7px;
    border-radius:20px;
    background:linear-gradient(#fff,transparent);
    opacity:.4;
    pointer-events:none;
}

.tube:after{
    content:"";
    position:absolute;
    z-index:20;
    left:5px;
    right:5px;
    top:1px;
    height:15px;
    border-top:2px solid rgba(255,255,255,.4);
    border-radius:50%;
    pointer-events:none;
}

.liquid{
    position:absolute;
    left:5px;
    right:5px;
    bottom:5px;
    height:calc(100% - 10px);
    display:flex;
    flex-direction:column-reverse;
    overflow:hidden;
    border-radius:9px 9px 24px 24px;
}

.block{
    position:relative;
    width:100%;
    height:25%;
    flex:0 0 25%;
    border-top:1px solid rgba(255,255,255,.25);
    box-shadow:
        inset 0 4px 8px rgba(255,255,255,.15),
        inset 0 -8px 14px rgba(0,0,0,.15);
}

.block:before{
    content:"";
    position:absolute;
    left:7px;
    top:5px;
    width:55%;
    height:18%;
    border-radius:50%;
    background:rgba(255,255,255,.3);
    filter:blur(2px);
}

/* 12 colors */
.c0{background:linear-gradient(135deg,#ff5477,#df214f)}
.c1{background:linear-gradient(135deg,#5d9cff,#286cff)}
.c2{background:linear-gradient(135deg,#59e4a8,#17b977)}
.c3{background:linear-gradient(135deg,#ffdc6c,#e89c20)}
.c4{background:linear-gradient(135deg,#bd8bff,#8247ed)}
.c5{background:linear-gradient(135deg,#65e8f5,#1aa5c7)}
.c6{background:linear-gradient(135deg,#ff91d5,#d94ba6)}
.c7{background:linear-gradient(135deg,#c8ed6b,#7faf31)}
.c8{background:linear-gradient(135deg,#ff875f,#e64d25)}
.c9{background:linear-gradient(135deg,#69d5ff,#197dcc)}
.c10{background:linear-gradient(135deg,#f875ff,#a72cdb)}
.c11{background:linear-gradient(135deg,#d6f15c,#82a92b)}

.number{
    position:absolute;
    bottom:-29px;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.3);
    font-size:9px;
    letter-spacing:2px;
}

.pouring{
    animation:pour .65s ease;
}

@keyframes pour{
    0%{transform:translateY(-15px) rotate(0)}
    30%{transform:translateY(-25px) rotate(-12deg)}
    65%{transform:translateY(-25px) rotate(-12deg)}
    100%{transform:translateY(0) rotate(0)}
}

.particle{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;
    pointer-events:none;
    z-index:100;
    animation:particle .8s ease-out forwards;
}

@keyframes particle{
    from{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
    to{
        opacity:0;
        transform:translate(var(--x),var(--y)) scale(.1);
    }
}

.overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    place-items:center;
    background:rgba(4,7,16,.8);
    backdrop-filter:blur(16px);
}

.overlay.show{
    display:grid;
}

.win{
    width:min(440px,calc(100% - 30px));
    padding:40px;
    text-align:center;
    border:1px solid rgba(255,255,255,.17);
    border-radius:28px;
    background:rgba(28,34,54,.94);
    box-shadow:0 40px 100px rgba(0,0,0,.55);
    animation:win .45s ease;
}

@keyframes win{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.win-icon{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    display:grid;
    place-items:center;
    border-radius:50%;
    font-size:42px;
    background:rgba(70,230,170,.12);
    border:1px solid rgba(70,230,170,.4);
    box-shadow:0 0 45px rgba(70,230,170,.15);
}

.win h2{
    margin:0 0 10px;
    font-size:32px;
}

.win p{
    color:#929db8;
}

.win-info{
    display:flex;
    justify-content:center;
    gap:55px;
    margin:25px 0;
}

.win-info strong{
    display:block;
    font-size:27px;
}

.win-info span{
    color:#8993ae;
    font-size:10px;
    text-transform:uppercase;
}

@media(max-width:700px){

    .app{
        padding:12px;
    }

    .stats{
        display:none;
    }

    header{
        margin-bottom:14px;
    }

    .controls{
        flex-direction:column;
    }

    .controls-left,
    .controls-right{
        width:100%;
    }

    .controls-left button,
    .controls-right button,
    .controls-right select{
        flex:1;
    }

    .game{
        padding:45px 4px 70px;
    }

    .board{
        gap:22px 2px;
    }

    .tube-wrap{
        transform:scale(.78);
        margin:-30px -7px;
    }

    .tube-wrap.selected{
        transform:scale(.84) translateY(-12px);
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="brand">

        <div class="logo">💧</div>

        <div>
            <h1>LIQUID SORT</h1>
            <div class="subtitle">
                3000 LEVEL CHALLENGE
            </div>
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <small>Level</small>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <small>Moves</small>
            <strong id="moves">0</strong>
        </div>

        <div class="stat">
            <small>Target</small>
            <strong id="target">10</strong>
        </div>

    </div>

</header>


<div class="controls">

    <div class="controls-left">

        <button id="undo">
            ↶ Undo
        </button>

        <button id="restart">
            ↻ Restart
        </button>

    </div>

    <div class="controls-right">

        <select id="levels"></select>

        <button
            class="primary"
            id="newPuzzle">
            ✦ New Puzzle
        </button>

    </div>

</div>


<div class="game">

    <div class="difficulty">

        <span id="difficultyText">
            3 COLORS · 3 EMPTY TUBES
        </span>

        · TARGET

        <span id="targetText">
            10 MOVES
        </span>

    </div>

    <div
        class="board"
        id="board">
    </div>

</div>

</div>


<div
    class="overlay"
    id="overlay">

    <div class="win">

        <div class="win-icon">
            ✓
        </div>

        <h2>
            Level Complete!
        </h2>

        <p>
            Perfect sorting!
        </p>

        <div class="win-info">

            <div>
                <strong id="winLevel">1</strong>
                <span>Level</span>
            </div>

            <div>
                <strong id="winMoves">0</strong>
                <span>Moves</span>
            </div>

        </div>

        <button
            class="primary"
            id="next">
            Next Level →
        </button>

    </div>

</div>


<script>

/* =========================================================
   GAME SETTINGS
========================================================= */

const CAPACITY = 4;

const MAX_LEVEL = 3000;


/*
    Twelve possible colors.

    The game starts with only a few
    and unlocks more as levels increase.
*/

const COLORS = [

    "#ff5477",
    "#4285ff",
    "#29cf91",
    "#f5ae36",
    "#9058f5",
    "#24b6d8",
    "#e95bad",
    "#8fc63c",
    "#ff7043",
    "#2ea7e6",
    "#c94cff",
    "#a7d83c"

];


/* =========================================================
   STATE
========================================================= */

let tubes = [];

let startingTubes = [];

let history = [];

let selected = -1;

let currentLevel = 1;

let moveCount = 0;

let locked = false;


/* =========================================================
   DOM
========================================================= */

const board =
    document.getElementById("board");

const levelText =
    document.getElementById("level");

const movesText =
    document.getElementById("moves");

const targetText =
    document.getElementById("target");

const difficultyText =
    document.getElementById("difficultyText");

const targetText2 =
    document.getElementById("targetText");

const levels =
    document.getElementById("levels");

const undoButton =
    document.getElementById("undo");

const restartButton =
    document.getElementById("restart");

const newPuzzleButton =
    document.getElementById("newPuzzle");

const overlay =
    document.getElementById("overlay");

const nextButton =
    document.getElementById("next");

const winLevel =
    document.getElementById("winLevel");

const winMoves =
    document.getElementById("winMoves");


/* =========================================================
   CREATE 3000 LEVEL OPTIONS
========================================================= */

for(let i=1;i<=MAX_LEVEL;i++){

    const option =
        document.createElement("option");

    option.value = i;

    option.textContent =
        "Level " + i;

    levels.appendChild(option);
}


/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficulty(level){

    let colors;
    let empty;
    let target;
    let scramble;


    /*
        LEVEL 1 - 50
    */

    if(level <= 50){

        colors =
            3 + Math.floor(level / 25);

        empty = 3;

        target =
            8 + Math.floor(level * .5);

        scramble =
            20 + level * 2;

    }


    /*
        LEVEL 51 - 200
    */

    else if(level <= 200){

        colors =
            4 + Math.floor(
                (level - 50) / 75
            );

        empty = 3;

        target =
            25 +
            Math.floor(
                (level - 50) * .35
            );

        scramble =
            100 +
            level * 2;

    }


    /*
        LEVEL 201 - 500
    */

    else if(level <= 500){

        colors = 5;

        empty = 2;

        target =
            45 +
            Math.floor(
                (level - 200) * .30
            );

        scramble =
            300 +
            level * 2;

    }


    /*
        LEVEL 501 - 1000
    */

    else if(level <= 1000){

        colors = 6;

        empty = 2;

        target =
            130 +
            Math.floor(
                (level - 500) * .25
            );

        scramble =
            700 +
            level * 2;

    }


    /*
        LEVEL 1001 - 1500
    */

    else if(level <= 1500){

        colors = 7;

        empty = 2;

        target =
            260 +
            Math.floor(
                (level - 1000) * .3
            );

        scramble =
            1200 +
            level * 2;

    }


    /*
        LEVEL 1501 - 2000
    */

    else if(level <= 2000){

        colors = 8;

        empty = 2;

        target =
            420 +
            Math.floor(
                (level - 1500) * .35
            );

        scramble =
            1700 +
            level * 2;

    }


    /*
        LEVEL 2001 - 2500
    */

    else if(level <= 2500){

        colors = 9;

        empty = 2;

        target =
            600 +
            Math.floor(
                (level - 2000) * .4
            );

        scramble =
            2300 +
            level * 2;

    }


    /*
        LEVEL 2501 - 3000
    */

    else{

        colors = 10;

        empty = 2;

        target =
            850 +
            Math.floor(
                (level - 2500) * .45
            );

        scramble =
            3000 +
            level * 2;

    }


    /*
        Never exceed available colors.
    */

    colors =
        Math.min(
            colors,
            COLORS.length
        );


    return {
        colors,
        empty,
        target,
        scramble
    };
}


/* =========================================================
   SOLVED PUZZLE
========================================================= */

function createSolvedState(
    colors,
    empty
){

    const state = [];


    for(
        let color=0;
        color<colors;
        color++
    ){

        state.push([
            color,
            color,
            color,
            color
        ]);

    }


    for(
        let i=0;
        i<empty;
        i++
    ){

        state.push([]);

    }


    return state;
}


/* =========================================================
   COPY
========================================================= */

function cloneState(state){

    return state.map(
        tube => [...tube]
    );

}


/* =========================================================
   SCRAMBLE
========================================================= */

function scramble(
    state,
    amount
){

    let previousFrom = -1;
    let previousTo = -1;


    for(
        let step=0;
        step<amount;
        step++
    ){

        const possible = [];


        for(
            let from=0;
            from<state.length;
            from++
        ){

            if(
                state[from].length === 0
            ){
                continue;
            }


            for(
                let to=0;
                to<state.length;
                to++
            ){

                if(from===to){
                    continue;
                }


                if(
                    state[to].length >= CAPACITY
                ){
                    continue;
                }


                /*
                    Do not immediately undo
                    the previous move.
                */

                if(
                    from === previousTo &&
                    to === previousFrom
                ){
                    continue;
                }


                possible.push({
                    from,
                    to
                });

            }
        }


        if(!possible.length){
            break;
        }


        /*
            Prefer moves that create
            mixed colors.
        */

        let candidates =
            possible.filter(move => {

                const source =
                    state[move.from];

                const target =
                    state[move.to];

                const color =
                    source[
                        source.length-1
                    ];


                if(
                    target.length === 0
                ){
                    return true;
                }


                return (
                    target[
                        target.length-1
                    ] !== color
                );

            });


        if(!candidates.length){
            candidates = possible;
        }


        const move =
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];


        state[move.to].push(
            state[move.from].pop()
        );


        previousFrom =
            move.from;

        previousTo =
            move.to;

    }

}


/* =========================================================
   PUZZLE GENERATION
========================================================= */

function generatePuzzle(level){

    const difficulty =
        getDifficulty(level);


    let best = null;

    let bestScore = -Infinity;


    /*
        We create several candidate puzzles
        and keep the most mixed one.
    */

    const attempts =
        level < 500 ? 15 : 8;


    for(
        let i=0;
        i<attempts;
        i++
    ){

        const state =
            createSolvedState(
                difficulty.colors,
                difficulty.empty
            );


        scramble(
            state,
            difficulty.scramble
        );


        const score =
            puzzleScore(state);


        if(score > bestScore){

            bestScore = score;

            best =
                cloneState(state);

        }

    }


    return best;
}


/* =========================================================
   PUZZLE SCORE
========================================================= */

function puzzleScore(state){

    let score = 0;


    for(
        const tube of state
    ){

        if(
            tube.length > 0 &&
            tube.length < CAPACITY
        ){

            score += 4;

        }


        for(
            let i=1;
            i<tube.length;
            i++
        ){

            if(
                tube[i] !== tube[i-1]
            ){

                score += 12;

            }

        }

    }


    return score;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    board.innerHTML = "";


    tubes.forEach(
        (tube,index)=>{

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "tube-wrap";

            wrapper.dataset.index =
                index;


            if(selected===index){

                wrapper.classList.add(
                    "selected"
                );

            }


            const glass =
                document.createElement("div");

            glass.className = "tube";


            const liquid =
                document.createElement("div");

            liquid.className = "liquid";


            tube.forEach(color=>{

                const block =
                    document.createElement("div");

                block.className =
                    "block c" + color;

                liquid.appendChild(block);

            });


            glass.appendChild(liquid);


            const number =
                document.createElement("div");

            number.className = "number";

            number.textContent =
                String(index+1).padStart(2,"0");


            wrapper.appendChild(glass);

            wrapper.appendChild(number);


            wrapper.addEventListener(
                "click",
                ()=>clickTube(index)
            );


            board.appendChild(wrapper);

        }
    );


    const difficulty =
        getDifficulty(currentLevel);


    levelText.textContent =
        currentLevel;

    movesText.textContent =
        moveCount;

    targetText.textContent =
        difficulty.target;


    difficultyText.textContent =
        `${difficulty.colors} COLORS · ${difficulty.empty} EMPTY TUBES`;


    targetText2.textContent =
        `${difficulty.target} MOVES`;


    undoButton.disabled =
        history.length === 0;

}


/* =========================================================
   CLICK
========================================================= */

function clickTube(index){

    if(locked){
        return;
    }


    if(selected===-1){

        if(
            tubes[index].length===0
        ){
            return;
        }


        selected=index;

        render();

        return;
    }


    if(selected===index){

        selected=-1;

        render();

        return;
    }


    const from=selected;
    const to=index;


    if(!canPour(from,to)){

        shakeTube(to);

        return;
    }


    pour(from,to);

}


/* =========================================================
   VALIDATE POUR
========================================================= */

function canPour(from,to){

    const source=tubes[from];
    const target=tubes[to];


    if(source.length===0){
        return false;
    }


    if(target.length>=CAPACITY){
        return false;
    }


    if(target.length===0){
        return true;
    }


    return (
        source[source.length-1] ===
        target[target.length-1]
    );

}


/* =========================================================
   NUMBER OF BLOCKS TO POUR
========================================================= */

function getPourAmount(from,to){

    const source=tubes[from];
    const target=tubes[to];


    const color =
        source[source.length-1];


    let amount=1;


    for(
        let i=source.length-2;
        i>=0;
        i--
    ){

        if(source[i]===color){
            amount++;
        }else{
            break;
        }

    }


    const free =
        CAPACITY-target.length;


    return Math.min(
        amount,
        free
    );

}


/* =========================================================
   POUR
========================================================= */

function pour(from,to){

    const amount =
        getPourAmount(from,to);


    history.push({
        state:cloneState(tubes),
        moves:moveCount
    });


    locked=true;


    const element =
        document.querySelector(
            `.tube-wrap[data-index="${from}"]`
        );


    if(element){

        element.classList.add(
            "pouring"
        );

    }


    const color =
        tubes[from][
            tubes[from].length-1
        ];


    createParticles(
        from,
        color
    );


    setTimeout(()=>{

        for(
            let i=0;
            i<amount;
            i++
        ){

            tubes[to].push(
                tubes[from].pop()
            );

        }


        moveCount++;

        selected=-1;

        locked=false;


        render();


        createParticles(
            to,
            color
        );


        if(isComplete()){

            setTimeout(
                victory,
                300
            );

        }

    },650);

}


/* =========================================================
   WIN CHECK
========================================================= */

function isComplete(){

    return tubes.every(tube=>{

        if(tube.length===0){
            return true;
        }


        if(tube.length!==CAPACITY){
            return false;
        }


        return tube.every(
            color =>
                color===tube[0]
        );

    });

}


/* =========================================================
   UNDO
========================================================= */

undoButton.addEventListener(
    "click",
    ()=>{

        if(
            locked ||
            !history.length
        ){
            return;
        }


        const previous =
            history.pop();


        tubes =
            cloneState(
                previous.state
            );


        moveCount =
            previous.moves;


        selected=-1;


        render();

    }
);


/* =========================================================
   RESTART
========================================================= */

restartButton.addEventListener(
    "click",
    ()=>{

        if(locked){
            return;
        }


        tubes =
            cloneState(
                startingTubes
            );


        history=[];

        moveCount=0;

        selected=-1;


        render();

    }
);


/* =========================================================
   NEW PUZZLE
========================================================= */

newPuzzleButton.addEventListener(
    "click",
    ()=>{

        if(locked){
            return;
        }


        loadLevel(
            currentLevel
        );

    }
);


/* =========================================================
   LEVEL SELECTOR
========================================================= */

levels.addEventListener(
    "change",
    ()=>{

        if(locked){
            return;
        }


        loadLevel(
            Number(levels.value)
        );

    }
);


/* =========================================================
   LOAD LEVEL
========================================================= */

function loadLevel(level){

    locked=false;

    currentLevel =
        Math.max(
            1,
            Math.min(
                MAX_LEVEL,
                level
            )
        );


    tubes =
        generatePuzzle(
            currentLevel
        );


    startingTubes =
        cloneState(tubes);


    history=[];

    moveCount=0;

    selected=-1;


    levels.value =
        currentLevel;


    render();

}


/* =========================================================
   SHAKE
========================================================= */

function shakeTube(index){

    const element =
        document.querySelector(
            `.tube-wrap[data-index="${index}"]`
        );


    if(!element){
        return;
    }


    element.animate(
        [
            {transform:"translateX(0)"},
            {transform:"translateX(-8px)"},
            {transform:"translateX(8px)"},
            {transform:"translateX(-6px)"},
            {transform:"translateX(6px)"},
            {transform:"translateX(0)"}
        ],
        {
            duration:300
        }
    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    index,
    color
){

    const element =
        document.querySelector(
            `.tube-wrap[data-index="${index}"]`
        );


    if(!element){
        return;
    }


    const rect =
        element.getBoundingClientRect();


    for(
        let i=0;
        i<12;
        i++
    ){

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        particle.style.background =
            COLORS[color];


        particle.style.boxShadow =
            `0 0 12px ${COLORS[color]}`;


        particle.style.left =
            rect.left +
            rect.width/2 +
            "px";


        particle.style.top =
            rect.top +
            rect.height/2 +
            "px";


        particle.style.setProperty(
            "--x",
            `${(Math.random()-.5)*120}px`
        );


        particle.style.setProperty(
            "--y",
            `${(Math.random()-.5)*120}px`
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            ()=>particle.remove(),
            850
        );

    }

}


/* =========================================================
   VICTORY
========================================================= */

function victory(){

    winLevel.textContent =
        currentLevel;

    winMoves.textContent =
        moveCount;


    overlay.classList.add(
        "show"
    );


    for(
        let i=0;
        i<90;
        i++
    ){

        setTimeout(()=>{

            const p =
                document.createElement("div");


            p.className =
                "particle";


            p.style.width="9px";

            p.style.height="9px";


            p.style.left =
                Math.random()*100+"vw";


            p.style.top="-10px";


            p.style.background =
                COLORS[
                    Math.floor(
                        Math.random() *
                        COLORS.length
                    )
                ];


            p.style.setProperty(
                "--x",
                `${(Math.random()-.5)*300}px`
            );


            p.style.setProperty(
                "--y",
                `${500+Math.random()*500}px`
            );


            document.body.appendChild(p);


            setTimeout(
                ()=>p.remove(),
                1300
            );

        },i*10);

    }

}


/* =========================================================
   NEXT LEVEL
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        overlay.classList.remove(
            "show"
        );


        if(
            currentLevel<MAX_LEVEL
        ){

            loadLevel(
                currentLevel+1
            );

        }else{

            loadLevel(1);

        }

    }
);


/* =========================================================
   START GAME
========================================================= */

loadLevel(1);

</script>
