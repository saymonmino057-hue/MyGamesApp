<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Skybound Jump</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05051a;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   HUD
========================= */

.hud{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    display:flex;
    gap:10px;

    pointer-events:none;
}

.hudBox{
    min-width:115px;
    padding:10px 16px;

    text-align:center;

    border:1px solid rgba(100,220,255,.35);
    border-radius:14px;

    background:rgba(7,12,40,.72);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 20px rgba(48,178,255,.12),
        inset 0 0 15px rgba(95,40,255,.08);
}

.hudBox small{
    display:block;
    color:#6de7ff;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:3px;
}

.hudBox strong{
    color:white;
    font-size:21px;
    text-shadow:0 0 10px #43dfff;
}

/* =========================
   MOBILE CONTROLS
========================= */

.controls{
    position:fixed;
    left:0;
    right:0;
    bottom:22px;

    display:flex;
    justify-content:space-between;

    padding:0 25px;

    z-index:20;

    pointer-events:none;
}

.control{
    width:76px;
    height:76px;

    border-radius:50%;

    border:1px solid rgba(107,225,255,.5);

    color:white;

    font-size:30px;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(83,221,255,.28),
            rgba(35,19,96,.75)
        );

    box-shadow:
        0 0 20px rgba(41,192,255,.25),
        inset 0 0 20px rgba(126,43,255,.18);

    backdrop-filter:blur(10px);

    pointer-events:auto;

    user-select:none;

    -webkit-user-select:none;

    transition:
        transform .1s,
        box-shadow .1s;
}

.control:active{
    transform:scale(.9);

    box-shadow:
        0 0 35px rgba(67,222,255,.7);
}

/* =========================
   START / GAME OVER
========================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(58,22,126,.25),
            rgba(2,3,18,.84)
        );

    backdrop-filter:blur(8px);

    transition:opacity .35s;
}

.overlay.hidden{
    opacity:0;
    pointer-events:none;
}

.menu{
    width:min(440px,90vw);

    padding:40px 30px;

    text-align:center;

    border:1px solid rgba(102,225,255,.4);

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(13,22,61,.92),
            rgba(8,5,34,.94)
        );

    box-shadow:
        0 0 50px rgba(63,68,255,.2),
        inset 0 0 40px rgba(92,42,255,.08);

    animation:
        menuFloat 3s ease-in-out infinite;
}

@keyframes menuFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.logo{
    font-size:48px;
    font-weight:900;
    line-height:.9;
    letter-spacing:-3px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #57e5ff 35%,
            #8d4dff 70%,
            #e932d1
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:none;

    margin-bottom:14px;
}

.subtitle{
    color:#9ec9e9;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:28px;
}

.menuStats{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
}

.menuStat{
    padding:10px 15px;

    border-radius:12px;

    background:rgba(21,31,76,.65);

    border:1px solid rgba(100,190,255,.18);
}

.menuStat span{
    display:block;
    color:#65dfff;
    font-size:9px;
}

.menuStat strong{
    display:block;
    margin-top:4px;
    color:white;
    font-size:20px;
}

.startButton{
    width:100%;
    height:58px;

    border:0;
    border-radius:16px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #6624ff,
            #bd2cff,
            #148cff,
            #6624ff
        );

    background-size:300% 100%;

    box-shadow:
        0 0 25px rgba(147,49,255,.55);

    animation:
        buttonMove 5s linear infinite;
}

@keyframes buttonMove{
    to{
        background-position:300% 0;
    }
}

.startButton:hover{
    transform:scale(1.02);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .hud{
        top:10px;
        gap:5px;
    }

    .hudBox{
        min-width:88px;
        padding:7px 10px;
    }

    .hudBox strong{
        font-size:17px;
    }

    .controls{
        bottom:18px;
        padding:0 18px;
    }

    .control{
        width:68px;
        height:68px;
    }

    .logo{
        font-size:40px;
    }

}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div class="hud">

    <div class="hudBox">
        <small>SCORE</small>
        <strong id="score">0</strong>
    </div>

    <div class="hudBox">
        <small>HEIGHT</small>
        <strong id="height">0</strong>
    </div>

    <div class="hudBox">
        <small>BEST</small>
        <strong id="best">0</strong>
    </div>

</div>


<!-- TOUCH CONTROLS -->
<div class="controls">

    <button
        class="control"
        id="left">
        ◀
    </button>

    <button
        class="control"
        id="right">
        ▶
    </button>

</div>


<!-- MENU -->
<div class="overlay" id="menu">

    <div class="menu">

        <div class="logo">
            SKYBOUND<br>
            JUMP
        </div>

        <div class="subtitle">
            ENDLESS VERTICAL ADVENTURE
        </div>

        <div class="menuStats">

            <div class="menuStat">
                <span>BEST</span>
                <strong id="menuBest">0</strong>
            </div>

            <div class="menuStat">
                <span>MODE</span>
                <strong>∞</strong>
            </div>

        </div>

        <button
            class="startButton"
            id="start">
            PLAY
        </button>

    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;


function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME SETTINGS
========================================================= */

const GRAVITY = 0.48;

const JUMP_POWER = -13.2;

const MOVE_SPEED = 5.2;

const MAX_FALL_SPEED = 15;

const PLAYER_SIZE = 34;


/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let gameOver = false;

let score = 0;

let heightScore = 0;

let cameraY = 0;

let highestWorldY = 0;

let lastTime = 0;

let shake = 0;

let platforms = [];

let particles = [];

let stars = [];

let clouds = [];

let trail = [];


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:0,
    y:0,

    vx:0,
    vy:0,

    width:PLAYER_SIZE,
    height:PLAYER_SIZE,

    rotation:0,

    onPlatform:false

};


/* =========================================================
   INPUT
========================================================= */

const keys = {

    left:false,
    right:false

};


window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=true;

        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=true;

        }

        if(
            e.key===" " &&
            gameOver
        ){

            startGame();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=false;

        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=false;

        }

    }
);


/* =========================================================
   TOUCH CONTROLS
========================================================= */

function touchButton(
    element,
    direction
){

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[direction]=true;

        }
    );

    element.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[direction]=false;

        }
    );

    element.addEventListener(
        "pointercancel",
        ()=>{
            keys[direction]=false;
        }
    );

    element.addEventListener(
        "pointerleave",
        ()=>{
            keys[direction]=false;
        }
    );

}


touchButton(
    document.getElementById("left"),
    "left"
);

touchButton(
    document.getElementById("right"),
    "right"
);


/* =========================================================
   WORLD GENERATION
========================================================= */

function createStars(){

    stars=[];

    for(
        let i=0;
        i<180;
        i++
    ){

        stars.push({

            x:Math.random()*W,

            y:Math.random()*H*3,

            size:
                Math.random()*2+.4,

            speed:
                .08+
                Math.random()*.25,

            alpha:
                .25+
                Math.random()*.75

        });

    }

}


function createClouds(){

    clouds=[];

    for(
        let i=0;
        i<12;
        i++
    ){

        clouds.push({

            x:
                Math.random()*W,

            y:
                Math.random()*H*3,

            width:
                100+
                Math.random()*180,

            height:
                30+
                Math.random()*60,

            speed:
                .05+
                Math.random()*.12,

            alpha:
                .04+
                Math.random()*.08

        });

    }

}


/* =========================================================
   PLATFORM CREATION
========================================================= */

function createPlatform(
    x,
    y,
    width,
    moving=false
){

    platforms.push({

        x:x,

        y:y,

        width:width,

        height:13,

        moving:moving,

        startX:x,

        direction:
            Math.random()>.5
            ?1
            :-1,

        speed:
            .7+
            Math.random()*.8,

        range:
            50+
            Math.random()*100,

        hue:
            170+
            Math.random()*130

    });

}


/* =========================================================
   INITIAL WORLD
========================================================= */

function generateInitialWorld(){

    platforms=[];

    const startY =
        H-100;

    createPlatform(
        W/2-70,
        startY,
        140,
        false
    );

    let y =
        startY-105;

    let x =
        W/2-50;


    for(
        let i=0;
        i<35;
        i++
    ){

        const width =
            85+
            Math.random()*65;

        x +=
            (Math.random()-.5)*180;

        x =
            Math.max(
                15,
                Math.min(
                    W-width-15,
                    x
                )
            );

        const moving =
            i>3 &&
            Math.random()<.28;

        createPlatform(
            x,
            y,
            width,
            moving
        );

        y -=
            85+
            Math.random()*65;

    }


    highestWorldY =
        y;

}


/* =========================================================
   MORE PLATFORMS
========================================================= */

function generateMorePlatforms(){

    while(
        highestWorldY >
        cameraY-1800
    ){

        const last =
            platforms[
                platforms.length-1
            ];

        let x =
            last
            ? last.x
            : W/2;

        x +=
            (Math.random()-.5)*190;

        const width =
            Math.max(
                65,
                125 -
                Math.min(
                    55,
                    score/500
                )+
                Math.random()*45
            );

        x =
            Math.max(
                10,
                Math.min(
                    W-width-10,
                    x
                )
            );

        highestWorldY -=
            85+
            Math.random()*65;

        const moving =
            Math.random()<
            Math.min(
                .55,
                .22+
                score/2500
            );

        createPlatform(
            x,
            highestWorldY,
            width,
            moving
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    score=0;

    heightScore=0;

    cameraY=0;

    shake=0;

    particles=[];

    trail=[];

    gameOver=false;

    player.x =
        W/2-PLAYER_SIZE/2;

    player.y =
        H-155;

    player.vx=0;

    player.vy=JUMP_POWER;

    player.rotation=0;

    generateInitialWorld();

    running=true;

    document
        .getElementById("menu")
        .classList.add("hidden");

    updateHUD();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(gameOver)
        return;

    gameOver=true;

    running=false;

    shake=20;

    burst(
        player.x+player.width/2,
        player.y-cameraY+player.height/2,
        40
    );


    const oldBest =
        Number(
            localStorage.getItem(
                "skyboundBest"
            )
        ) || 0;


    if(score>oldBest){

        localStorage.setItem(
            "skyboundBest",
            score
        );

    }


    setTimeout(
        ()=>{
            showGameOver();
        },
        650
    );

}


/* =========================================================
   GAME OVER MENU
========================================================= */

function showGameOver(){

    const menu =
        document.getElementById(
            "menu"
        );

    const box =
        menu.querySelector(".menu");

    const best =
        Number(
            localStorage.getItem(
                "skyboundBest"
            )
        ) || 0;


    box.innerHTML=`

        <div class="logo">
            GAME<br>
            OVER
        </div>

        <div class="subtitle">
            THE SKY WASN'T ENOUGH
        </div>

        <div class="menuStats">

            <div class="menuStat">
                <span>SCORE</span>
                <strong>${score}</strong>
            </div>

            <div class="menuStat">
                <span>BEST</span>
                <strong>${best}</strong>
            </div>

        </div>

        <button
            class="startButton"
            id="restart">
            PLAY AGAIN
        </button>

    `;


    menu.classList.remove(
        "hidden"
    );


    document
        .getElementById("restart")
        .addEventListener(
            "click",
            startGame
        );

}


/* =========================================================
   PHYSICS
========================================================= */

function update(dt){

    /* horizontal movement */

    if(keys.left){

        player.vx -=
            .55*dt;

    }

    if(keys.right){

        player.vx +=
            .55*dt;

    }


    if(
        !keys.left &&
        !keys.right
    ){

        player.vx *=
            Math.pow(
                .82,
                dt
            );

    }


    player.vx =
        Math.max(
            -MOVE_SPEED,
            Math.min(
                MOVE_SPEED,
                player.vx
            )
        );


    player.x +=
        player.vx*dt;


    /* screen wrapping */

    if(
        player.x >
        W+10
    ){

        player.x =
            -player.width;

    }

    if(
        player.x+
        player.width <
        -10
    ){

        player.x=W;

    }


    /* gravity */

    player.vy +=
        GRAVITY*dt;


    player.vy =
        Math.min(
            player.vy,
            MAX_FALL_SPEED
        );


    const previousY =
        player.y;


    player.y +=
        player.vy*dt;


    player.rotation +=
        player.vx*.025*dt;


    /* platform movement */

    for(
        const p of platforms
    ){

        if(p.moving){

            p.x +=
                p.direction*
                p.speed*
                dt;

            if(
                Math.abs(
                    p.x-p.startX
                ) >
                p.range
            ){

                p.direction *= -1;

            }

            p.x =
                Math.max(
                    5,
                    Math.min(
                        W-p.width-5,
                        p.x
                    )
                );

        }

    }


    /* collision */

    if(
        player.vy>0
    ){

        const bottom =
            player.y+
            player.height;

        const previousBottom =
            previousY+
            player.height;


        for(
            const p of platforms
        ){

            if(

                previousBottom <= p.y &&

                bottom >= p.y &&

                player.x+
                player.width >
                p.x &&

                player.x <
                p.x+p.width

            ){

                player.y =
                    p.y-player.height;

                player.vy =
                    JUMP_POWER;

                player.onPlatform=true;

                score += 10;

                burst(
                    player.x+
                    player.width/2,
                    player.y-cameraY+
                    player.height,
                    10
                );

                break;

            }

        }

    }


    /* camera */

    const targetCamera =
        player.y -
        H*.45;


    if(
        targetCamera <
        cameraY
    ){

        cameraY +=
            (
                targetCamera -
                cameraY
            )*.12*dt;

    }


    /* height */

    heightScore =
        Math.max(
            heightScore,
            Math.floor(
                Math.max(
                    0,
                    -cameraY
                )/10
            )
        );


    /* generate world */

    generateMorePlatforms();


    /* remove old platforms */

    platforms =
        platforms.filter(
            p =>
                p.y-cameraY <
                H+500
        );


    /* trail */

    if(
        Math.abs(player.vy)>2
    ){

        trail.push({

            x:
                player.x+
                player.width/2,

            y:
                player.y+
                player.height/2,

            life:1,

            size:
                5+
                Math.random()*7

        });

    }


    for(
        const t of trail
    ){

        t.life -=
            .045*dt;

    }


    trail =
        trail.filter(
            t=>t.life>0
        );


    /* particles */

    updateParticles();


    /* difficulty */

    updateHUD();


    /* falling */

    if(
        player.y-cameraY >
        H+150
    ){

        endGame();

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function burst(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            1+
            Math.random()*5;

        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:1,

            size:
                2+
                Math.random()*5,

            hue:
                170+
                Math.random()*150

        });

    }

}


function updateParticles(){

    for(
        const p of particles
    ){

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .08;

        p.life -=
            .025;

    }


    particles =
        particles.filter(
            p=>p.life>0
        );

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#030522"
    );

    gradient.addColorStop(
        .45,
        "#101052"
    );

    gradient.addColorStop(
        1,
        "#17082d"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* moon */

    const moonX =
        W*.78;

    const moonY =
        110+
        cameraY*.03;


    const glow =
        ctx.createRadialGradient(
            moonX,
            moonY,
            10,
            moonX,
            moonY,
            110
        );

    glow.addColorStop(
        0,
        "rgba(180,225,255,.3)"
    );

    glow.addColorStop(
        .35,
        "rgba(90,170,255,.1)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        110,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "rgba(225,245,255,.9)";

    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        32,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* stars */

    for(
        const s of stars
    ){

        let y =
            (
                s.y+
                cameraY*s.speed
            ) %
            (H*1.5);

        if(y<0)
            y += H*1.5;

        const alpha =
            s.alpha*
            (
                .7+
                Math.sin(
                    performance.now()*.001+
                    s.x
                )*.3
            );

        ctx.globalAlpha=alpha;

        ctx.fillStyle =
            "#cceeff";

        ctx.beginPath();

        ctx.arc(
            s.x,
            y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    /* clouds */

    for(
        const c of clouds
    ){

        let y =
            (
                c.y+
                cameraY*c.speed
            ) %
            (H*1.5);

        if(y<0)
            y += H*1.5;

        ctx.globalAlpha =
            c.alpha;

        ctx.fillStyle =
            "#b7e7ff";

        ctx.beginPath();

        ctx.ellipse(
            c.x,
            y,
            c.width*.5,
            c.height,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================================================
   DRAW PLATFORMS
========================================================= */

function drawPlatforms(){

    for(
        const p of platforms
    ){

        const screenY =
            p.y-cameraY;


        if(
            screenY < -50 ||
            screenY > H+50
        )
            continue;


        /* glow */

        const glow =
            ctx.createLinearGradient(
                p.x,
                screenY,
                p.x,
                screenY+p.height
            );

        glow.addColorStop(
            0,
            `hsla(${p.hue},100%,70%,1)`
        );

        glow.addColorStop(
            .45,
            `hsla(${p.hue},90%,50%,1)`
        );

        glow.addColorStop(
            1,
            `hsla(${p.hue},80%,25%,1)`
        );


        ctx.shadowColor =
            `hsla(${p.hue},100%,60%,.8)`;

        ctx.shadowBlur=18;


        roundRect(
            p.x,
            screenY,
            p.width,
            p.height,
            7
        );

        ctx.fillStyle =
            glow;

        ctx.fill();


        ctx.shadowBlur=0;


        /* highlight */

        ctx.fillStyle =
            "rgba(255,255,255,.55)";

        roundRect(
            p.x+7,
            screenY+2,
            p.width-14,
            3,
            2
        );

        ctx.fill();


        /* moving platform indicator */

        if(p.moving){

            ctx.fillStyle =
                "rgba(255,255,255,.18)";

            ctx.beginPath();

            ctx.arc(
                p.x+p.width/2,
                screenY+p.height/2,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    const x =
        player.x;

    const y =
        player.y-cameraY;


    /* trail */

    for(
        const t of trail
    ){

        const ty =
            t.y-cameraY;

        ctx.globalAlpha =
            t.life*.35;

        ctx.fillStyle =
            "#48ddff";

        ctx.shadowColor =
            "#43ddff";

        ctx.shadowBlur=14;

        ctx.beginPath();

        ctx.arc(
            t.x,
            ty,
            t.size*t.life,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

    ctx.shadowBlur=0;


    ctx.save();

    ctx.translate(
        x+player.width/2,
        y+player.height/2
    );

    ctx.rotate(
        player.rotation
    );


    /* aura */

    const aura =
        ctx.createRadialGradient(
            0,
            0,
            4,
            0,
            0,
            35
        );

    aura.addColorStop(
        0,
        "rgba(80,230,255,.5)"
    );

    aura.addColorStop(
        1,
        "rgba(80,100,255,0)"
    );

    ctx.fillStyle=aura;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        35,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.shadowColor =
        "#4bdfff";

    ctx.shadowBlur=18;

    const body =
        ctx.createLinearGradient(
            -16,
            -16,
            16,
            16
        );

    body.addColorStop(
        0,
        "#ffffff"
    );

    body.addColorStop(
        .35,
        "#5eeaff"
    );

    body.addColorStop(
        1,
        "#7848ff"
    );


    ctx.fillStyle=body;

    roundRect(
        -15,
        -15,
        30,
        30,
        10
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /* face */

    ctx.fillStyle =
        "#07103a";

    ctx.beginPath();

    ctx.arc(
        -6,
        -2,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        6,
        -2,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* smile */

    ctx.strokeStyle =
        "#07103a";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        0,
        2,
        6,
        0,
        Math.PI
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        const screenY =
            p.y-cameraY;

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            `hsl(${p.hue},100%,65%)`;

        ctx.shadowColor =
            `hsl(${p.hue},100%,65%)`;

        ctx.shadowBlur=10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            screenY,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );

}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw(){

    ctx.save();


    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

        shake *= .86;

        if(shake<.1)
            shake=0;

    }


    drawBackground();

    drawPlatforms();

    drawParticles();

    drawPlayer();


    ctx.restore();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        score;

    document.getElementById(
        "height"
    ).textContent =
        heightScore;

    const best =
        Number(
            localStorage.getItem(
                "skyboundBest"
            )
        ) || 0;

    document.getElementById(
        "best"
    ).textContent =
        best;

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    if(!running)
        return;


    let dt =
        (time-lastTime)/16.6667;


    dt =
        Math.min(
            dt,
            2
        );


    lastTime=time;


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
    "start"
).addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIAL SCREEN
========================================================= */

const savedBest =
    Number(
        localStorage.getItem(
            "skyboundBest"
        )
    ) || 0;

document.getElementById(
    "best"
).textContent =
    savedBest;

document.getElementById(
    "menuBest"
).textContent =
    savedBest;


/* =========================================================
   INITIAL BACKGROUND
========================================================= */

createStars();

createClouds();

draw();

</script>
