<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحنش النيون</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at center, #0f172a, #020617); 
            color: white; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        h1 { 
            color: #22c55e; 
            margin-bottom: 5px; 
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }
        .score { 
            font-size: 1.2rem; 
            margin-bottom: 20px; 
            font-weight: 600; 
            color: #94a3b8;
        }
        .score span { color: #22c55e; }
        
        /* حاوية اللعبة باش نقدرو نحطو وسطها شاشة الخسارة */
        .game-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        canvas { 
            background-color: #0f172a; 
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            border: 2px solid #22c55e; 
            border-radius: 20px; 
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2); 
        }

        /* شاشة Game Over العصرية */
        .game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .game-over-screen h2 {
            color: #f43f5e;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
        }
        .game-over-screen p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin: 0 0 20px 0;
        }
        .restart-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
            transition: 0.2s;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
        
        .back-btn { 
            margin-top: 25px; 
            padding: 12px 24px; 
            background: #1e293b; 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 1rem; 
            transition: all 0.2s; 
        }
        .back-btn:hover { 
            background: #334155; 
            border-color: #22c55e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>🐍 لـعـبـة الـحـنـش 🐍</h1>
    <div class="score">النقاط: <span id="scoreText">0</span></div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- شاشة الخسارة الجديدة -->
        <div class="game-over-screen" id="gameOverScreen">
            <h2>Game Over</h2>
            <p>النتيجة ديالك هي: <span id="finalScore" style="color:#22c55e; font-weight:600;">0</span></p>
            <button class="restart-btn" onclick="resetGame()">إعادة اللعب 🔄</button>
        </div>
    </div>
    
    <a href="index.html" class="back-btn">⬅️ الرجوع للمركز</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
        let dx = gridSize, dy = 0;
        let foodX, foodY;
        let score = 0;
        let isGameOver = false;

        createFood();
        main();

        function main() {
            if (hasGameEnded()) {
                isGameOver = true;
                document.getElementById("finalScore").innerText = score;
                document.getElementById("gameOverScreen").classList.add("active");
                return; // كيوقف المين بلا ديك الحيط ديال الـ alert
            }
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 140);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
                ctx.shadowBlur = index === 0 ? 15 : 0;
                ctx.shadowColor = "#22c55e";
                
                ctx.beginPath();
                ctx.roundRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2, 6);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            if (isGameOver) return;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === foodX && snake[0].y === foodY) {
                score += 10;
                document.getElementById("scoreText").innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function createFood() {
            foodX = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            foodY = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
            snake.forEach(part => {
                if (part.x === foodX && part.y === foodY) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#f43f5e";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#f43f5e";
            ctx.beginPath();
            ctx.roundRect(foodX + 2, foodY + 2, gridSize - 4, gridSize - 4, 20);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function resetGame() {
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = gridSize; dy = 0; score = 0;
            isGameOver = false;
            document.getElementById("scoreText").innerText = "0";
            document.getElementById("gameOverScreen").classList.remove("active");
            createFood();
            main();
        }

        document.addEventListener("keydown", changeDirection);
        function changeDirection(event) {
            if (isGameOver) return;
            const keyPressed = event.keyCode;
            if (keyPressed === 37 && dx === 0) { dx = -gridSize; dy = 0; }
            if (keyPressed === 38 && dy === 0) { dx = 0; dy = -gridSize; }
            if (keyPressed === 39 && dx === 0) { dx = gridSize; dy = 0; }
            if (keyPressed === 40 && dy === 0) { dx = 0; dy = gridSize; }
        }
    </script>
</body>
</html>
