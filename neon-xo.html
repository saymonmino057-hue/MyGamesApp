<script>
"use strict";

/* =========================================================
   STAR BACKGROUND
========================================================= */

const starCanvas =
  document.getElementById("stars");

const starCtx =
  starCanvas.getContext("2d");

let stars = [];
let sw = 0;
let sh = 0;

function resizeStars(){

  const rect =
    starCanvas.getBoundingClientRect();

  const dpr =
    Math.min(window.devicePixelRatio || 1,2);

  sw = rect.width;
  sh = rect.height;

  starCanvas.width =
    sw*dpr;

  starCanvas.height =
    sh*dpr;

  starCtx.setTransform(
    dpr,0,0,dpr,0,0
  );

  stars = [];

  for(let i=0;i<90;i++){

    stars.push({
      x:Math.random()*sw,
      y:Math.random()*sh,
      r:Math.random()*1.5+.2,
      speed:Math.random()*.35+.05,
      alpha:Math.random()*.7+.2
    });
  }
}

function animateStars(){

  starCtx.clearRect(
    0,0,sw,sh
  );

  for(const s of stars){

    s.y += s.speed;

    if(s.y > sh)
      s.y = -2;

    starCtx.globalAlpha =
      s.alpha;

    starCtx.fillStyle =
      "#9deeff";

    starCtx.beginPath();

    starCtx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    starCtx.fill();
  }

  starCtx.globalAlpha=1;

  requestAnimationFrame(
    animateStars
  );
}

window.addEventListener(
  "resize",
  resizeStars
);

resizeStars();
animateStars();


/* =========================================================
   GAME
========================================================= */

const cells =
  [...document.querySelectorAll(".cell")];

const board =
  document.getElementById("board");

const mode =
  document.getElementById("mode");

const statusText =
  document.getElementById("statusText");

const turnDot =
  document.getElementById("turnDot");

const xCard =
  document.getElementById("xCard");

const oCard =
  document.getElementById("oCard");

const modal =
  document.getElementById("modal");

const modalIcon =
  document.getElementById("modalIcon");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const xScore =
  document.getElementById("xScore");

const oScore =
  document.getElementById("oScore");

const tieScore =
  document.getElementById("tieScore");

let boardState =
  Array(9).fill("");

let currentPlayer = "X";

let gameActive = true;

let scores = {
  X: Number(localStorage.getItem("neonXO_X") || 0),
  O: Number(localStorage.getItem("neonXO_O") || 0),
  T: Number(localStorage.getItem("neonXO_T") || 0)
};

const WIN_PATTERNS = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
];


/* =========================================================
   SCORE UI
========================================================= */

function updateScore(){

  xScore.textContent =
    scores.X;

  oScore.textContent =
    scores.O;

  tieScore.textContent =
    scores.T;
}

updateScore();


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

  if(!gameActive)
    return;

  if(mode.value === "ai"){

    if(currentPlayer === "X"){

      statusText.textContent =
        "Your turn — X";

    }else{

      statusText.textContent =
        "AI is thinking — O";
    }

  }else{

    statusText.textContent =
      "Player " + currentPlayer + " turn";
  }

  turnDot.style.background =
    currentPlayer === "X"
      ? "var(--cyan)"
      : "var(--pink)";

  turnDot.style.boxShadow =
    currentPlayer === "X"
      ? "0 0 14px var(--cyan)"
      : "0 0 14px var(--pink)";

  xCard.classList.toggle(
    "active",
    currentPlayer === "X"
  );

  oCard.classList.toggle(
    "active",
    currentPlayer === "O"
  );
}


/* =========================================================
   RENDER BOARD
========================================================= */

function render(){

  cells.forEach((cell,i)=>{

    cell.innerHTML = "";

    cell.classList.toggle(
      "filled",
      boardState[i] !== ""
    );

    if(boardState[i]){

      const mark =
        document.createElement("div");

      mark.className =
        "mark " +
        boardState[i].toLowerCase();

      mark.textContent =
        boardState[i];

      cell.appendChild(mark);
    }
  });
}


/* =========================================================
   CLICK
========================================================= */

cells.forEach(cell=>{

  cell.addEventListener(
    "click",
    ()=>{

      if(!gameActive)
        return;

      if(boardState[cell.dataset.index])
        return;

      if(
        mode.value === "ai" &&
        currentPlayer === "O"
      )
        return;

      makeMove(
        Number(cell.dataset.index),
        currentPlayer
      );

    }
  );
});


/* =========================================================
   MAKE MOVE
========================================================= */

function makeMove(index,player){

  boardState[index] = player;

  render();

  /*
     Tiny board impact animation.
  */

  const cell =
    cells[index];

  cell.animate(
    [
      {transform:"scale(.82)"},
      {transform:"scale(1.08)"},
      {transform:"scale(1)"}
    ],
    {
      duration:300,
      easing:"cubic-bezier(.2,.9,.2,1)"
    }
  );

  const result =
    evaluate(boardState);

  if(result){

    finishGame(result);

    return;
  }

  currentPlayer =
    player === "X" ? "O" : "X";

  updateStatus();

  /*
     AI turn.
  */

  if(
    mode.value === "ai" &&
    currentPlayer === "O"
  ){

    setTimeout(
      aiMove,
      360
    );
  }
}


/* =========================================================
   EVALUATE
========================================================= */

function evaluate(state){

  for(const pattern of WIN_PATTERNS){

    const [a,b,c] = pattern;

    if(
      state[a] &&
      state[a] === state[b] &&
      state[a] === state[c]
    ){

      return {
        winner:state[a],
        pattern
      };
    }
  }

  if(
    state.every(Boolean)
  ){

    return {
      winner:"T",
      pattern:null
    };
  }

  return null;
}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(result){

  gameActive = false;

  if(result.winner === "T"){

    scores.T++;

    localStorage.setItem(
      "neonXO_T",
      scores.T
    );

    updateScore();

    showModal(
      "🤝",
      "IT'S A TIE",
      "Both players matched perfectly."
    );

    return;
  }

  scores[result.winner]++;

  localStorage.setItem(
    "neonXO_" + result.winner,
    scores[result.winner]
  );

  updateScore();

  highlightWinner(
    result.pattern
  );

  if(
    mode.value === "ai" &&
    result.winner === "O"
  ){

    showModal(
      "🤖",
      "AI WINS",
      "The machine found the perfect line."
    );

  }else{

    showModal(
      result.winner === "X"
        ? "⚡"
        : "🔥",
      "PLAYER " +
        result.winner +
        " WINS",
      "Excellent move sequence."
    );
  }
}


/* =========================================================
   WIN LINE
========================================================= */

function highlightWinner(pattern){

  pattern.forEach(i=>{
    cells[i].classList.add(
      "winCell"
    );
  });

  /*
     Draw line based on the centers
     of the winning cells.
  */

  requestAnimationFrame(()=>{

    const first =
      cells[pattern[0]]
        .getBoundingClientRect();

    const last =
      cells[pattern[2]]
        .getBoundingClientRect();

    const boardRect =
      board.getBoundingClientRect();

    const x1 =
      first.left +
      first.width/2 -
      boardRect.left;

    const y1 =
      first.top +
      first.height/2 -
      boardRect.top;

    const x2 =
      last.left +
      last.width/2 -
      boardRect.left;

    const y2 =
      last.top +
      last.height/2 -
      boardRect.top;

    const dx =
      x2-x1;

    const dy =
      y2-y1;

    const length =
      Math.sqrt(
        dx*dx+dy*dy
      );

    const angle =
      Math.atan2(dy,dx) *
      180 /
      Math.PI;

    const line =
      document.createElement("div");

    line.className =
      "winLine";

    line.style.width =
      length+"px";

    line.style.left =
      x1+"px";

    line.style.top =
      y1+"px";

    line.style.transform =
      "rotate("+angle+"deg) scaleX(0)";

    board.appendChild(line);

    requestAnimationFrame(()=>{
      line.style.transform =
        "rotate("+angle+"deg) scaleX(1)";
    });
  });
}


/* =========================================================
   SMART AI — MINIMAX
========================================================= */

function aiMove(){

  if(
    !gameActive ||
    currentPlayer !== "O"
  )
    return;

  let bestScore = -Infinity;
  let bestMove = -1;

  for(let i=0;i<9;i++){

    if(!boardState[i]){

      boardState[i] = "O";

      const score =
        minimax(
          boardState,
          false,
          0
        );

      boardState[i] = "";

      if(score > bestScore){

        bestScore = score;
        bestMove = i;
      }
    }
  }

  if(bestMove !== -1){

    makeMove(
      bestMove,
      "O"
    );
  }
}


function minimax(
  state,
  maximizing,
  depth
){

  const result =
    evaluate(state);

  if(result){

    if(result.winner === "O")
      return 10-depth;

    if(result.winner === "X")
      return depth-10;

    return 0;
  }

  if(maximizing){

    let best = -Infinity;

    for(let i=0;i<9;i++){

      if(!state[i]){

        state[i] = "O";

        best =
          Math.max(
            best,
            minimax(
              state,
              false,
              depth+1
            )
          );

        state[i] = "";
      }
    }

    return best;

  }else{

    let best = Infinity;

    for(let i=0;i<9;i++){

      if(!state[i]){

        state[i] = "X";

        best =
          Math.min(
            best,
            minimax(
              state,
              true,
              depth+1
            )
          );

        state[i] = "";
      }
    }

    return best;
  }
}


/* =========================================================
   MODAL
========================================================= */

function showModal(
  icon,
  title,
  text
){

  modalIcon.textContent = icon;
  modalTitle.textContent = title;
  modalText.textContent = text;

  modal.classList.add("show");
}


/* =========================================================
   NEW ROUND
========================================================= */

function newRound(){

  boardState =
    Array(9).fill("");

  currentPlayer = "X";

  gameActive = true;

  cells.forEach(cell=>{
    cell.classList.remove(
      "winCell"
    );
  });

  document
    .querySelectorAll(".winLine")
    .forEach(line=>{
      line.remove();
    });

  modal.classList.remove(
    "show"
  );

  render();
  updateStatus();
}

document
  .getElementById("newRound")
  .addEventListener(
    "click",
    newRound
  );

document
  .getElementById("modalAgain")
  .addEventListener(
    "click",
    newRound
  );


/* =========================================================
   RESET SCORE
========================================================= */

document
  .getElementById("resetScores")
  .addEventListener(
    "click",
    ()=>{

      scores = {
        X:0,
        O:0,
        T:0
      };

      localStorage.removeItem(
        "neonXO_X"
      );

      localStorage.removeItem(
        "neonXO_O"
      );

      localStorage.removeItem(
        "neonXO_T"
      );

      updateScore();

      newRound();
    }
  );

========================================================= */

mode.addEventListener(
  "change",
  ()=>{

    newRound();

    if(mode.value === "ai"){

      statusText.textContent =
        "Your turn — X";

    }else{

      statusText.textContent =
        "Player X turn";
    }
  }
);

updateStatus();
