<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Block Flow</title>

<style>
/* =========================================================
   BLOCK FLOW
   Clean single-file CSS
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(110, 80, 255, 0.22),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 90%,
            rgba(0, 220, 255, 0.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(255, 70, 190, 0.10),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #060914,
            #10152c 48%,
            #080b18
        );
}

/* Main application */

.game {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 500px;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;

    isolation: isolate;
}

/* Background glow */

.game::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;

    left: 50%;
    top: 42%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(115, 90, 255, 0.12),
            transparent 67%
        );

    filter: blur(20px);
    pointer-events: none;
    z-index: -2;
}

/* Decorative stars */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.stars {
    opacity: 0.55;
    z-index: -1;

    background-image:
        radial-gradient(circle, white 1px, transparent 1.5px),
        radial-gradient(circle, #8ddcff 1px, transparent 1.5px),
        radial-gradient(circle, #ffffff 1px, transparent 1.5px);

    background-size:
        130px 130px,
        190px 190px,
        260px 260px;

    background-position:
        10px 20px,
        50px 70px,
        100px 30px;

    animation: starsMove 18s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(130px);
    }
}

/* Header */

.header {
    width: min(900px, 94vw);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding-top: clamp(12px, 3vh, 28px);
    padding-bottom: clamp(8px, 1.5vh, 16px);

    flex-shrink: 0;
}

.logo {
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 950;
    letter-spacing: 3px;

    background:
        linear-gradient(
            90deg,
            #62e8ff,
            #9275ff,
            #ff5bd8
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
        0 0 30px rgba(100, 180, 255, 0.25);
}

.logo span {
    font-weight: 500;
    opacity: 0.8;
}

/* Statistics */

.stats {
    display: flex;
    gap: 8px;
}

.stat {
    min-width: 82px;

    padding: 8px 14px;

    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.035)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 30px rgba(0,0,0,0.22);

    backdrop-filter: blur(14px);
}

.stat-label {
    display: block;

    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;

    color: #8791b6;
}

.stat-value {
    display: block;

    margin-top: 2px;

    font-size: 18px;
    font-weight: 900;
}

/* Board area */

.board-wrap {
    position: relative;

    width: min(
        62vh,
        72vw,
        610px
    );

    aspect-ratio: 1;

    flex-shrink: 1;

    display: grid;
    place-items: center;
}

/* Board outer glow */

.board-glow {
    position: absolute;
    inset: -35px;

    border-radius: 45px;

    background:
        radial-gradient(
            circle,
            rgba(104, 110, 255, 0.18),
            transparent 68%
        );

    filter: blur(24px);

    pointer-events: none;
}

/* Board */

.board {
    position: relative;

    width: 100%;
    height: 100%;

    padding: clamp(7px, 1.2vw, 12px);

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    gap: clamp(3px, 0.55vw, 7px);

    border-radius: clamp(20px, 3vw, 32px);

    border: 1px solid rgba(255,255,255,0.13);

    background:
        linear-gradient(
            145deg,
            rgba(35,43,76,0.78),
            rgba(11,15,31,0.88)
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 50px rgba(87,92,255,0.08);

    backdrop-filter: blur(18px);

    touch-action: none;
}

/* Board cells */

.cell {
    position: relative;

    border-radius: clamp(5px, 0.8vw, 9px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.065),
            rgba(255,255,255,0.018)
        );

    border: 1px solid rgba(255,255,255,0.035);

    transition:
        transform 0.12s ease,
        background 0.12s ease,
        box-shadow 0.12s ease;
}

.cell::after {
    content: "";

    position: absolute;
    inset: 1px;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.04),
            transparent 55%
        );

    pointer-events: none;
}

/* Piece colors */

.cell.filled {
    border-color: transparent;

    box-shadow:
        0 0 12px var(--piece-glow),
        0 0 28px var(--piece-glow),
        inset 0 2px 0 rgba(255,255,255,0.38),
        inset 0 -5px 12px rgba(0,0,0,0.22);

    background:
        linear-gradient(
            145deg,
            var(--piece-light),
            var(--piece),
            var(--piece-dark)
        );

    animation: blockAppear 0.2s ease-out;
}

@keyframes blockAppear {
    0% {
        transform: scale(0.72);
        opacity: 0.2;
    }

    70% {
        transform: scale(1.06);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Placement preview */

.cell.preview-valid {
    background:
        rgba(70,255,190,0.28);

    border-color:
        rgba(95,255,210,0.85);

    box-shadow:
        inset 0 0 15px rgba(50,255,190,0.22),
        0 0 14px rgba(50,255,190,0.20);
}

.cell.preview-invalid {
    background:
        rgba(255,65,105,0.22);

    border-color:
        rgba(255,75,110,0.75);

    box-shadow:
        inset 0 0 15px rgba(255,50,90,0.20);
}

/* Bottom controls */

.bottom {
    width: min(900px, 94vw);

    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: clamp(5px, 1vh, 10px);

    padding-bottom: clamp(10px, 2vh, 22px);
}

/* Instructions */

.instructions {
    color: #8994b7;

    font-size: clamp(8px, 1.1vw, 11px);

    font-weight: 800;

    letter-spacing: 2.5px;
    text-transform: uppercase;

    text-align: center;
}

/* Pieces */

.pieces {
    width: min(560px, 90vw);

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: clamp(8px, 2vw, 18px);
}

.piece-slot {
    position: relative;

    height: clamp(72px, 11vh, 105px);

    display: grid;
    place-items: center;

    border-radius: 18px;

    border: 1px solid rgba(255,255,255,0.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.025)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 12px 35px rgba(0,0,0,0.20);

    backdrop-filter: blur(12px);

    touch-action: none;
}

.piece-slot.empty {
    opacity: 0.22;
}

/* Piece */

.piece {
    position: relative;

    display: grid;

    cursor: grab;

    transform-origin: center;

    user-select: none;

    touch-action: none;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

.piece:hover {
    transform: scale(1.08);
}

.piece.dragging {
    cursor: grabbing;

    transform: scale(1.18);

    filter:
        drop-shadow(
            0 0 14px var(--piece-glow)
        );
}

/* Individual mini blocks */

.mini {
    width: clamp(14px, 2vw, 20px);
    height: clamp(14px, 2vw, 20px);

    margin: 2px;

    border-radius: 5px;

    background:
        linear-gradient(
            145deg,
            var(--piece-light),
            var(--piece),
            var(--piece-dark)
        );

    box-shadow:
        0 0 8px var(--piece-glow),
        inset 0 1px 0 rgba(255,255,255,0.38),
        inset 0 -3px 7px rgba(0,0,0,0.22);
}

/* Restart */

.restart {
    position: absolute;

    right: max(3vw, 18px);
    bottom: max(2vh, 16px);

    border: 1px solid rgba(255,255,255,0.12);

    color: white;

    padding: 9px 14px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.07);

    font-size: 11px;
    font-weight: 900;

    letter-spacing: 1px;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.restart:hover {
    transform: translateY(-2px);

    background:
        rgba(255,255,255,0.13);
}

/* Combo text */

.combo {
    position: fixed;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%)
        scale(0.6);

    pointer-events: none;

    opacity: 0;

    z-index: 20;

    font-size: clamp(30px, 6vw, 64px);

    font-weight: 1000;

    letter-spacing: 4px;

    color: white;

    text-shadow:
        0 0 10px #6d8cff,
        0 0 30px #8b62ff,
        0 0 70px #ff4fd8;
}

.combo.show {
    animation: comboPop 0.75s ease-out forwards;
}

@keyframes comboPop {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0.45);
    }

    25% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    70% {
        opacity: 1;
        transform:
            translate(-50%, -58%)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -90%)
            scale(0.95);
    }
}

/* Particle canvas */

#fx {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 30;
}

/* Modal */

.modal {
    position: fixed;
    inset: 0;

    display: grid;
    place-items: center;

    padding: 20px;

    background:
        rgba(4,6,16,0.76);

    backdrop-filter: blur(14px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

    z-index: 100;
}

.modal.show {
    opacity: 1;
    visibility: visible;
}

.modal-card {
    width: min(430px, 90vw);

    padding: 34px 28px;

    text-align: center;

    border-radius: 28px;

    border: 1px solid rgba(255,255,255,0.12);

    background:
        linear-gradient(
            145deg,
            rgba(35,42,75,0.95),
            rgba(10,13,28,0.96)
        );

    box-shadow:
        0 40px 100px rgba(0,0,0,0.55),
        0 0 70px rgba(108,86,255,0.14);

    transform: scale(0.85);

    transition:
        transform 0.3s cubic-bezier(.2,.9,.2,1);
}

.modal.show .modal-card {
    transform: scale(1);
}

.modal-icon {
    font-size: 42px;

    margin-bottom: 8px;

    filter:
        drop-shadow(
            0 0 15px #8b6dff
        );
}

.modal h1 {
    font-size: 32px;

    margin-bottom: 8px;

    background:
        linear-gradient(
            90deg,
            #64e9ff,
            #a56cff,
            #ff62d6
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.modal p {
    color: #929bb9;

    margin-bottom: 22px;
}

.final-score {
    font-size: 42px;
    font-weight: 950;

    margin-bottom: 22px;
}

.play-again {
    border: 0;

    padding: 13px 30px;

    border-radius: 14px;

    color: white;

    font-size: 14px;
    font-weight: 900;

    letter-spacing: 1px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #607bff,
            #9c62ff,
            #ef5ed2
        );

    box-shadow:
        0 10px 30px rgba(126,91,255,0.35);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.play-again:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 15px 40px rgba(126,91,255,0.50);
}

/* Small screens */

@media (max-height: 650px) {

    .header {
        padding-top: 8px;
        padding-bottom: 5px;
    }

    .stat {
        padding: 5px 10px;
    }

    .stat-value {
        font-size: 15px;
    }

    .board-wrap {
        width: min(54vh, 70vw);
    }

    .piece-slot {
        height: 62px;
    }

    .instructions {
        display: none;
    }

    .bottom {
        padding-bottom: 7px;
    }
}

@media (max-width: 480px) {

    .logo {
        font-size: 19px;
        letter-spacing: 2px;
    }

    .stat {
        min-width: 65px;
        padding: 6px 8px;
    }

    .stat-label {
        font-size: 7px;
    }

    .stat-value {
        font-size: 15px;
    }

    .board-wrap {
        width: min(70vh, 91vw);
    }

    .pieces {
        width: 92vw;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="stars"></div>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            BLOCK<span>/</span>FLOW
        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-label">Score</span>
                <span
                    id="score"
                    class="stat-value"
                >0</span>
            </div>

            <div class="stat">
                <span class="stat-label">Best</span>
                <span
                    id="best"
                    class="stat-value"
                >0</span>
            </div>

        </div>

    </header>


    <!-- BOARD -->
    <main class="board-wrap">

        <div class="board-glow"></div>

        <div
            id="board"
            class="board"
        ></div>

    </main>


    <!-- BOTTOM -->
    <section class="bottom">

        <div class="instructions">
            Drag a block • Fill rows & columns • Clear the grid
        </div>

        <div
            id="pieces"
            class="pieces"
        ></div>

    </section>


    <button
        id="restart"
        class="restart"
    >
        ↻ RESTART
    </button>

</div>


<!-- EFFECT CANVAS -->
<canvas id="fx"></canvas>


<!-- COMBO -->
<div
    id="combo"
    class="combo"
>
    PERFECT!
</div>


<!-- GAME OVER -->
<div
    id="gameOver"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-icon">✦</div>

        <h1>GRID OVERLOAD</h1>

        <p>
            No more space for your blocks.
        </p>

        <div
            id="finalScore"
            class="final-score"
        >
            0
        </div>

        <button
            id="playAgain"
            class="play-again"
        >
            PLAY AGAIN
        </button>

    </div>

</div>


<script>
/* =========================================================
   BLOCK FLOW
   Complete game logic
   ========================================================= */

"use strict";


/* ---------------------------------------------------------
   DOM
   --------------------------------------------------------- */

const boardElement =
    document.getElementById("board");

const piecesElement =
    document.getElementById("pieces");

const scoreElement =
    document.getElementById("score");

const bestElement =
    document.getElementById("best");

const restartButton =
    document.getElementById("restart");

const gameOverElement =
    document.getElementById("gameOver");

const finalScoreElement =
    document.getElementById("finalScore");

const playAgainButton =
    document.getElementById("playAgain");

const comboElement =
    document.getElementById("combo");

const fxCanvas =
    document.getElementById("fx");

const fx =
    fxCanvas.getContext("2d");


/* ---------------------------------------------------------
   CONSTANTS
   --------------------------------------------------------- */

const SIZE = 10;

const COLORS = [
    {
        name: "cyan",
        piece: "#24dfff",
        light: "#b6f8ff",
        dark: "#087fbb",
        glow: "rgba(36,223,255,.55)"
    },
    {
        name: "purple",
        piece: "#8b62ff",
        light: "#d2c5ff",
        dark: "#4b2cb5",
        glow: "rgba(139,98,255,.55)"
    },
    {
        name: "pink",
        piece: "#ff5fc8",
        light: "#ffc1e9",
        dark: "#a52a78",
        glow: "rgba(255,95,200,.55)"
    },
    {
        name: "green",
        piece: "#4fffb0",
        light: "#c3ffe4",
        dark: "#16966a",
        glow: "rgba(79,255,176,.5)"
    },
    {
        name: "yellow",
        piece: "#ffd85a",
        light: "#fff2af",
        dark: "#b48113",
        glow: "rgba(255,216,90,.5)"
    },
    {
        name: "orange",
        piece: "#ff8c4a",
        light: "#ffd0ae",
        dark: "#b64016",
        glow: "rgba(255,140,74,.5)"
    }
];


/* ---------------------------------------------------------
   SHAPES
   Coordinates are row/column offsets.
   Small shapes keep the bottom area compact.
   --------------------------------------------------------- */

const SHAPES = [

    // Single
    [[0,0]],

    // Two
    [[0,0],[0,1]],

    // Three horizontal
    [[0,0],[0,1],[0,2]],

    // Three vertical
    [[0,0],[1,0],[2,0]],

    // Small L
    [[0,0],[1,0],[1,1]],

    // Reverse L
    [[0,1],[1,0],[1,1]],

    // T
    [[0,0],[0,1],[0,2],[1,1]],

    // Square
    [[0,0],[0,1],[1,0],[1,1]],

    // Small zigzag
    [[0,1],[0,2],[1,0],[1,1]],

    // Long 4
    [[0,0],[0,1],[0,2],[0,3]]
];


/* ---------------------------------------------------------
   GAME STATE
   --------------------------------------------------------- */

let grid = [];

let pieces = [];

let score = 0;

let best =
    Number(
        localStorage.getItem("blockFlowBest") || 0
    );

let drag = null;


/* ---------------------------------------------------------
   FX PARTICLES
   --------------------------------------------------------- */

let particles = [];


/* ---------------------------------------------------------
   CANVAS RESIZE
   --------------------------------------------------------- */

function resizeFX() {

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    fxCanvas.width =
        Math.floor(window.innerWidth * dpr);

    fxCanvas.height =
        Math.floor(window.innerHeight * dpr);

    fxCanvas.style.width =
        window.innerWidth + "px";

    fxCanvas.style.height =
        window.innerHeight + "px";

    fx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeFX
);

resizeFX();


/* ---------------------------------------------------------
   CREATE EMPTY GRID
   --------------------------------------------------------- */

function createGrid() {

    grid = Array.from(
        { length: SIZE },
        () => Array(SIZE).fill(null)
    );
}


/* ---------------------------------------------------------
   DRAW BOARD
   --------------------------------------------------------- */

function renderBoard() {

    boardElement.innerHTML = "";

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            if (grid[row][col]) {

                const color =
                    grid[row][col];

                applyColor(
                    cell,
                    color
                );

                cell.classList.add("filled");
            }

            boardElement.appendChild(cell);
        }
    }
}


/* ---------------------------------------------------------
   APPLY PIECE COLOR
   --------------------------------------------------------- */

function applyColor(element, color) {

    element.style.setProperty(
        "--piece",
        color.piece
    );

    element.style.setProperty(
        "--piece-light",
        color.light
    );

    element.style.setProperty(
        "--piece-dark",
        color.dark
    );

    element.style.setProperty(
        "--piece-glow",
        color.glow
    );
}


/* ---------------------------------------------------------
   CREATE RANDOM PIECES
   --------------------------------------------------------- */

function createPieces() {

    pieces = [];

    for (let i = 0; i < 3; i++) {

        const shape =
            SHAPES[
                Math.floor(
                    Math.random() * SHAPES.length
                )
            ];

        const color =
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ];

        pieces.push({
            shape,
            color
        });
    }

    renderPieces();
}


/* ---------------------------------------------------------
   RENDER PIECES
   --------------------------------------------------------- */

function renderPieces() {

    piecesElement.innerHTML = "";

    pieces.forEach(
        (piece, index) => {

            const slot =
                document.createElement("div");

            slot.className =
                "piece-slot";

            if (!piece) {

                slot.classList.add("empty");

                piecesElement.appendChild(slot);

                return;
            }

            const visual =
                document.createElement("div");

            visual.className =
                "piece";

            visual.dataset.index =
                index;

            visual.style.setProperty(
                "--piece",
                piece.color.piece
            );

            visual.style.setProperty(
                "--piece-light",
                piece.color.light
            );

            visual.style.setProperty(
                "--piece-dark",
                piece.color.dark
            );

            visual.style.setProperty(
                "--piece-glow",
                piece.color.glow
            );

            buildMiniPiece(
                visual,
                piece.shape
            );

            visual.addEventListener(
                "pointerdown",
                startDrag
            );

            slot.appendChild(visual);

            piecesElement.appendChild(slot);
        }
    );
}


/* ---------------------------------------------------------
   BUILD SMALL PIECE VISUAL
   --------------------------------------------------------- */

function buildMiniPiece(
    container,
    shape
) {

    const maxRow =
        Math.max(
            ...shape.map(
                p => p[0]
            )
        );

    const maxCol =
        Math.max(
            ...shape.map(
                p => p[1]
            )
        );

    container.style.gridTemplateColumns =
        `repeat(${maxCol + 1}, auto)`;

    container.style.gridTemplateRows =
        `repeat(${maxRow + 1}, auto)`;

    const cells =
        new Set(
            shape.map(
                p => `${p[0]},${p[1]}`
            )
        );

    for (
        let r = 0;
        r <= maxRow;
        r++
    ) {

        for (
            let c = 0;
            c <= maxCol;
            c++
        ) {

            const mini =
                document.createElement("div");

            if (
                cells.has(
                    `${r},${c}`
                )
            ) {
                mini.className =
                    "mini";
            } else {
                mini.style.visibility =
                    "hidden";
                mini.className =
                    "mini";
            }

            container.appendChild(mini);
        }
    }
}


/* ---------------------------------------------------------
   POINTER / TOUCH DRAGGING
   --------------------------------------------------------- */

function startDrag(event) {

    if (drag) return;

    const pieceElement =
        event.currentTarget;

    const index =
        Number(
            pieceElement.dataset.index
        );

    const piece =
        pieces[index];

    if (!piece) return;

    event.preventDefault();

    pieceElement.setPointerCapture(
        event.pointerId
    );

    pieceElement.classList.add(
        "dragging"
    );

    drag = {
        index,
        piece,
        element: pieceElement,
        pointerId: event.pointerId
    };

    updateDrag(event);

    pieceElement.addEventListener(
        "pointermove",
        updateDrag
    );

    pieceElement.addEventListener(
        "pointerup",
        finishDrag
    );

    pieceElement.addEventListener(
        "pointercancel",
        cancelDrag
    );
}


/* ---------------------------------------------------------
   UPDATE DRAG
   --------------------------------------------------------- */

function updateDrag(event) {

    if (!drag) return;

    const boardRect =
        boardElement.getBoundingClientRect();

    const x =
        event.clientX -
        boardRect.left;

    const y =
        event.clientY -
        boardRect.top;

    const cellWidth =
        boardRect.width / SIZE;

    const cellHeight =
        boardRect.height / SIZE;

    /*
       Move the piece slightly above
       the pointer so it doesn't hide
       the target cell.
    */

    const lift =
        Math.min(75, boardRect.height * 0.10);

    const col =
        Math.floor(
            x / cellWidth
        );

    const row =
        Math.floor(
            (y - lift) /
            cellHeight
        );

    drag.row = row;
    drag.col = col;

    clearPreview();

    if (
        isValidPlacement(
            drag.piece.shape,
            row,
            col
        )
    ) {

        showPreview(
            drag.piece,
            row,
            col,
            true
        );

    } else {

        showPreview(
            drag.piece,
            row,
            col,
            false
        );
    }
}


/* ---------------------------------------------------------
   FINISH DRAG
   --------------------------------------------------------- */

function finishDrag(event) {

    if (!drag) return;

    const pieceElement =
        drag.element;

    pieceElement.classList.remove(
        "dragging"
    );

    pieceElement.releasePointerCapture(
        event.pointerId
    );

    pieceElement.removeEventListener(
        "pointermove",
        updateDrag
    );

    pieceElement.removeEventListener(
        "pointerup",
        finishDrag
    );

    pieceElement.removeEventListener(
        "pointercancel",
        cancelDrag
    );

    const valid =
        isValidPlacement(
            drag.piece.shape,
            drag.row,
            drag.col
        );

    if (valid) {

        placePiece(
            drag.index,
            drag.piece,
            drag.row,
            drag.col
        );

    } else {

        clearPreview();
    }

    drag = null;
}


/* ---------------------------------------------------------
   CANCEL DRAG
   --------------------------------------------------------- */

function cancelDrag() {

    if (!drag) return;

    drag.element.classList.remove(
        "dragging"
    );

    clearPreview();

    drag = null;
}


/* ---------------------------------------------------------
   CHECK VALID PLACEMENT
   --------------------------------------------------------- */

function isValidPlacement(
    shape,
    row,
    col
) {

    if (
        row === undefined ||
        col === undefined
    ) {
        return false;
    }

    for (const [dr, dc] of shape) {

        const r =
            row + dr;

        const c =
            col + dc;

        if (
            r < 0 ||
            r >= SIZE ||
            c < 0 ||
            c >= SIZE
        ) {
            return false;
        }

        if (grid[r][c]) {
            return false;
        }
    }

    return true;
}


/* ---------------------------------------------------------
   SHOW PLACEMENT PREVIEW
   --------------------------------------------------------- */

function showPreview(
    piece,
    row,
    col,
    valid
) {

    const cells =
        boardElement.children;

    for (const [dr, dc] of piece.shape) {

        const r =
            row + dr;

        const c =
            col + dc;

        if (
            r < 0 ||
            r >= SIZE ||
            c < 0 ||
            c >= SIZE
        ) {
            continue;
        }

        const cell =
            cells[
                r * SIZE + c
            ];

        if (!cell) continue;

        cell.classList.add(
            valid
                ? "preview-valid"
                : "preview-invalid"
        );
    }
}


/* ---------------------------------------------------------
   CLEAR PREVIEW
   --------------------------------------------------------- */

function clearPreview() {

    boardElement
        .querySelectorAll(
            ".preview-valid, .preview-invalid"
        )
        .forEach(
            cell => {

                cell.classList.remove(
                    "preview-valid",
                    "preview-invalid"
                );
            }
        );
}


/* ---------------------------------------------------------
   PLACE PIECE
   --------------------------------------------------------- */

function placePiece(
    index,
    piece,
    row,
    col
) {

    clearPreview();

    for (const [dr, dc] of piece.shape) {

        grid[row + dr][col + dc] =
            piece.color;
    }

    const boardRect =
        boardElement.getBoundingClientRect();

    const cellW =
        boardRect.width / SIZE;

    const cellH =
        boardRect.height / SIZE;

    for (const [dr, dc] of piece.shape) {

        spawnParticles(
            boardRect.left +
            (col + dc + 0.5) * cellW,

            boardRect.top +
            (row + dr + 0.5) * cellH,

            piece.color
        );
    }

    pieces[index] = null;

    renderBoard();
    renderPieces();

    /*
       Check lines after placement.
    */

    setTimeout(
        () => clearCompletedLines(),
        120
    );
}


/* ---------------------------------------------------------
   CLEAR COMPLETED ROWS AND COLUMNS
   --------------------------------------------------------- */

function clearCompletedLines() {

    const rows = [];
    const cols = [];

    for (let r = 0; r < SIZE; r++) {

        let complete = true;

        for (let c = 0; c < SIZE; c++) {

            if (!grid[r][c]) {
                complete = false;
                break;
            }
        }

        if (complete) {
            rows.push(r);
        }
    }

    for (let c = 0; c < SIZE; c++) {

        let complete = true;

        for (let r = 0; r < SIZE; r++) {

            if (!grid[r][c]) {
                complete = false;
                break;
            }
        }

        if (complete) {
            cols.push(c);
        }
    }

    if (
        rows.length === 0 &&
        cols.length === 0
    ) {

        afterTurn();
        return;
    }

    /*
       Collect unique cells.
    */

    const clearSet =
        new Set();

    rows.forEach(
        r => {

            for (
                let c = 0;
                c < SIZE;
                c++
            ) {
                clearSet.add(
                    `${r},${c}`
                );
            }
        }
    );

    cols.forEach(
        c => {

            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                clearSet.add(
                    `${r},${c}`
                );
            }
        }
    );

    /*
       Score.
    */

    const cleared =
        clearSet.size;

    const lineCount =
        rows.length +
        cols.length;

    const multiplier =
        Math.max(
            1,
            lineCount
        );

    score +=
        cleared *
        10 *
        multiplier;

    updateScore();

    /*
       Explosion particles.
    */

    const boardRect =
        boardElement.getBoundingClientRect();

    const cellW =
        boardRect.width / SIZE;

    const cellH =
        boardRect.height / SIZE;

    clearSet.forEach(
        key => {

            const [
                r,
                c
            ] =
                key
                    .split(",")
                    .map(Number);

            const color =
                grid[r][c];

            spawnBurst(
                boardRect.left +
                (c + 0.5) * cellW,

                boardRect.top +
                (r + 0.5) * cellH,

                color
            );

            grid[r][c] = null;
        }
    );

    showCombo(
        lineCount
    );

    renderBoard();

    setTimeout(
        afterTurn,
        220
    );
}


/* ---------------------------------------------------------
   AFTER TURN
   --------------------------------------------------------- */

function afterTurn() {

    /*
       If all three pieces have been used,
       generate a fresh set.
    */

    if (
        pieces.every(
            piece => piece === null
        )
    ) {

        createPieces();
    }

    /*
       Check whether at least one available
       piece can fit somewhere.
    */

    if (!hasAnyMove()) {

        setTimeout(
            showGameOver,
            350
        );
    }
}


/* ---------------------------------------------------------
   GAME OVER CHECK
   --------------------------------------------------------- */

function hasAnyMove() {

    for (
        let i = 0;
        i < pieces.length;
        i++
    ) {

        const piece =
            pieces[i];

        if (!piece) continue;

        if (
            canPieceFit(
                piece.shape
            )
        ) {
            return true;
        }
    }

    return false;
}


/* ---------------------------------------------------------
   CAN PIECE FIT ANYWHERE?
   --------------------------------------------------------- */

function canPieceFit(shape) {

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            if (
                isValidPlacement(
                    shape,
                    row,
                    col
                )
            ) {
                return true;
            }
        }
    }

    return false;
}


/* ---------------------------------------------------------
   SCORE UI
   --------------------------------------------------------- */

function updateScore() {

    scoreElement.textContent =
        score.toLocaleString();

    if (score > best) {

        best = score;

        localStorage.setItem(
            "blockFlowBest",
            String(best)
        );
    }

    bestElement.textContent =
        best.toLocaleString();
}


/* ---------------------------------------------------------
   COMBO
   --------------------------------------------------------- */

function showCombo(lines) {

    if (lines <= 1) {

        comboElement.textContent =
            "CLEAR!";

    } else if (lines === 2) {

        comboElement.textContent =
            "DOUBLE! ×2";

    } else if (lines === 3) {

        comboElement.textContent =
            "TRIPLE! ×3";

    } else {

        comboElement.textContent =
            "MEGA CLEAR! ×" +
            lines;
    }

    comboElement.classList.remove(
        "show"
    );

    /*
       Force browser reflow so animation
       can restart every time.
    */

    void comboElement.offsetWidth;

    comboElement.classList.add(
        "show"
    );
}


/* ---------------------------------------------------------
   PARTICLE SYSTEM
   --------------------------------------------------------- */

function spawnParticles(
    x,
    y,
    color
) {

    for (let i = 0; i < 7; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            1 +
            Math.random() * 2.5;

        particles.push({
            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                0.35 +
                Math.random() * 0.35,

            maxLife:
                0.7,

            size:
                1.5 +
                Math.random() * 3,

            color:
                color.piece
        });
    }
}


/* ---------------------------------------------------------
   LINE CLEAR BURST
   --------------------------------------------------------- */

function spawnBurst(
    x,
    y,
    color
) {

    for (let i = 0; i < 14; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            1 +
            Math.random() * 5;

        particles.push({
            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                0.5 +
                Math.random() * 0.5,

            maxLife:
                1,

            size:
                2 +
                Math.random() * 4,

            color:
                color
                    ? color.piece
                    : "#ffffff"
        });
    }
}


/* ---------------------------------------------------------
   PARTICLE ANIMATION
   --------------------------------------------------------- */

function animateParticles() {

    fx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.985;
        p.vy *= 0.985;

        p.vy += 0.035;

        p.life -= 0.016;

        if (p.life <= 0) {

            particles.splice(
                i,
                1
            );

            continue;
        }

        const alpha =
            Math.max(
                0,
                p.life / p.maxLife
            );

        fx.globalAlpha =
            alpha;

        fx.fillStyle =
            p.color;

        fx.shadowColor =
            p.color;

        fx.shadowBlur =
            12;

        fx.beginPath();

        fx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        fx.fill();
    }

    fx.globalAlpha = 1;
    fx.shadowBlur = 0;

    requestAnimationFrame(
        animateParticles
    );
}


/* ---------------------------------------------------------
   GAME OVER
   --------------------------------------------------------- */

function showGameOver() {

    finalScoreElement.textContent =
        score.toLocaleString();

    gameOverElement.classList.add(
        "show"
    );
}


/* ---------------------------------------------------------
   RESTART
   --------------------------------------------------------- */

function restartGame() {

    gameOverElement.classList.remove(
        "show"
    );

    score = 0;

    updateScore();

    createGrid();

    createPieces();

    renderBoard();
}


/* ---------------------------------------------------------
   BUTTONS
   --------------------------------------------------------- */

restartButton.addEventListener(
    "click",
    restartGame
);

playAgainButton.addEventListener(
    "click",
    restartGame
);


/* ---------------------------------------------------------
   START GAME
   --------------------------------------------------------- */

function startGame() {

    bestElement.textContent =
        best.toLocaleString();

    createGrid();

    createPieces();

    renderBoard();
}


/* ---------------------------------------------------------
   START PARTICLES
   --------------------------------------------------------- */

animateParticles();

startGame();

</script>
