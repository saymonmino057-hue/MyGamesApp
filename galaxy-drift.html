<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Drift</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020510;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    #gameWrap {
        position: relative;
        width: min(100vw, 1100px);
        height: min(100vh, 760px);
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 45%, rgba(46, 91, 180, 0.18), transparent 35%),
            radial-gradient(circle at 15% 20%, rgba(130, 40, 255, 0.13), transparent 28%),
            radial-gradient(circle at 85% 75%, rgba(0, 220, 255, 0.1), transparent 30%),
            #020510;
        border: 1px solid rgba(90, 170, 255, 0.3);
        border-radius: 24px;
        box-shadow:
            0 0 50px rgba(0, 100, 255, 0.18),
            inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
    }

    /* HUD */

    .hud {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        display: flex;
        gap: 10px;

        padding: 10px;

        background: rgba(5, 12, 30, 0.72);
        border: 1px solid rgba(100, 190, 255, 0.25);
        border-radius: 18px;

        backdrop-filter: blur(14px);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
    }

    .stat {
        min-width: 110px;
        padding: 7px 16px;
        text-align: center;
    }

    .label {
        display: block;
        font-size: 9px;
        letter-spacing: 3px;
        color: #7891b9;
        margin-bottom: 4px;
    }

    .value {
        font-size: 21px;
        font-weight: 900;
        color: #63eaff;
        text-shadow: 0 0 14px rgba(70, 220, 255, 0.7);
    }

    #shieldValue {
        color: #a979ff;
        text-shadow: 0 0 14px rgba(170, 100, 255, 0.8);
    }

    /* Logo */

    .logo {
        position: absolute;
        top: 28px;
        left: 30px;
        z-index: 10;
        pointer-events: none;
    }

    .logo h1 {
        font-size: 22px;
        letter-spacing: 4px;
        font-weight: 900;
        color: #fff;
        text-shadow:
            0 0 10px #27cfff,
            0 0 30px rgba(39, 207, 255, 0.5);
    }

    .logo span {
        display: block;
        margin-top: 3px;
        color: #58759f;
        font-size: 9px;
        letter-spacing: 3px;
    }

    /* Pause */

    #pauseBtn {
        position: absolute;
        top: 24px;
        right: 25px;
        z-index: 20;

        width: 42px;
        height: 42px;

        border: 1px solid rgba(100, 190, 255, 0.35);
        border-radius: 12px;

        background: rgba(5, 15, 35, 0.75);
        color: white;
        cursor: pointer;

        font-size: 17px;
        transition: 0.2s;
    }

    #pauseBtn:hover {
        transform: scale(1.08);
        border-color: #54dfff;
        box-shadow: 0 0 20px rgba(50, 210, 255, 0.4);
    }

    /* Start / Game Over */

    .overlay {
        position: absolute;
        inset: 0;
        z-index: 30;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(1, 4, 14, 0.58);
        backdrop-filter: blur(7px);

        transition: opacity 0.3s;
    }

    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .panel {
        width: min(90%, 460px);
        padding: 42px 35px;
        text-align: center;

        background:
            linear-gradient(
                145deg,
                rgba(13, 30, 65, 0.94),
                rgba(4, 9, 25, 0.96)
            );

        border: 1px solid rgba(85, 200, 255, 0.3);
        border-radius: 28px;

        box-shadow:
            0 0 80px rgba(25, 100, 255, 0.2),
            inset 0 0 35px rgba(100, 150, 255, 0.04);
    }

    .panel .icon {
        font-size: 54px;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 20px rgba(50, 210, 255, 0.7));
    }

    .panel h2 {
        font-size: 34px;
        letter-spacing: 4px;
        margin-bottom: 10px;

        background: linear-gradient(90deg, #42dfff, #9b6cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .panel p {
        color: #7d91b5;
        line-height: 1.7;
        font-size: 14px;
    }

    .controls {
        margin: 22px 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .controlKey {
        padding: 11px;
        border-radius: 10px;
        background: rgba(80, 140, 220, 0.08);
        border: 1px solid rgba(100, 180, 255, 0.14);
        color: #9eb5d8;
        font-size: 11px;
    }

    button.primary {
        border: none;
        padding: 15px 38px;
        border-radius: 14px;

        color: white;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;

        cursor: pointer;

        background: linear-gradient(
            135deg,
            #287dff,
            #9b42ff
        );

        box-shadow:
            0 8px 30px rgba(70, 100, 255, 0.35),
            inset 0 1px rgba(255, 255, 255, 0.3);

        transition: 0.2s;
    }

    button.primary:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow:
            0 12px 40px rgba(90, 100, 255, 0.5);
    }

    #finalScore {
        color: #53eaff;
        font-size: 28px;
        font-weight: 900;
        margin: 8px 0 20px;
    }

    /* Mobile controls */

    .touchControls {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 18px;
        z-index: 15;

        display: flex;
        justify-content: space-between;
        pointer-events: none;
    }

    .touchGroup {
        display: flex;
        gap: 10px;
        pointer-events: auto;
    }

    .touchButton {
        width: 58px;
        height: 58px;

        border-radius: 17px;
        border: 1px solid rgba(100, 200, 255, 0.25);

        background: rgba(7, 17, 40, 0.7);
        color: #c9eaff;

        font-size: 23px;
        cursor: pointer;

        backdrop-filter: blur(10px);
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
    }

    .touchButton:active {
        transform: scale(0.9);
        background: rgba(40, 120, 255, 0.3);
    }

    @media (min-width: 800px) {
        .touchControls {
            display: none;
        }
    }

    @media (max-width: 700px) {
        .logo {
            top: 85px;
            left: 20px;
        }

        .hud {
            top: 15px;
            gap: 0;
        }

        .stat {
            min-width: 75px;
            padding: 5px 8px;
        }

        .value {
            font-size: 17px;
        }

        .panel h2 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div id="gameWrap">

    <canvas id="game"></canvas>

    <div class="logo">
        <h1>GALAXY DRIFT</h1>
        <span>DEEP SPACE EXPLORER</span>
    </div>

    <div class="hud">
        <div class="stat">
            <span class="label">DISTANCE</span>
            <span class="value" id="distance">0</span>
        </div>

        <div class="stat">
            <span class="label">CRYSTALS</span>
            <span class="value" id="score">0</span>
        </div>

        <div class="stat">
            <span class="label">SHIELD</span>
            <span class="value" id="shieldValue">100</span>
        </div>
    </div>

    <button id="pauseBtn">Ⅱ</button>

    <div class="touchControls">
        <div class="touchGroup">
            <button class="touchButton" id="leftBtn">←</button>
            <button class="touchButton" id="rightBtn">→</button>
        </div>

        <div class="touchGroup">
            <button class="touchButton" id="boostBtn">⚡</button>
        </div>
    </div>

    <div class="overlay" id="startOverlay">
        <div class="panel">
            <div class="icon">🚀</div>
            <h2>GALAXY DRIFT</h2>
            <p>
                Pilot your ship through the infinite galaxy.
                Dodge asteroids and collect rare cosmic crystals.
            </p>

            <div class="controls">
                <div class="controlKey">← / A<br>MOVE LEFT</div>
                <div class="controlKey">↑ / SPACE<br>BOOST</div>
                <div class="controlKey">→ / D<br>MOVE RIGHT</div>
            </div>

            <button class="primary" id="startBtn">
                START MISSION
            </button>
        </div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <div class="panel">
            <div class="icon">💥</div>
            <h2>MISSION LOST</h2>

            <p>Your spacecraft was destroyed.</p>

            <div id="finalScore">0 CRYSTALS</div>

            <button class="primary" id="restartBtn">
                PLAY AGAIN
            </button>
        </div>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   GALAXY DRIFT
   Complete Canvas Space Explorer
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gameWrap = document.getElementById("gameWrap");

const distanceEl = document.getElementById("distance");
const scoreEl = document.getElementById("score");
const shieldEl = document.getElementById("shieldValue");

const startOverlay = document.getElementById("startOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const boostBtn = document.getElementById("boostBtn");

/* =========================================================
   Canvas
   ========================================================= */

let W = 1000;
let H = 700;
let DPR = 1;

function resize() {
    const rect = gameWrap.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* =========================================================
   Game State
   ========================================================= */

let running = false;
let paused = false;

let score = 0;
let distance = 0;
let shield = 100;

let speed = 2.8;
let difficulty = 1;

let spawnTimer = 0;
let crystalTimer = 0;

let shake = 0;

let lastTime = 0;

/* =========================================================
   Input
   ========================================================= */

const keys = {
    left: false,
    right: false,
    boost: false
};

window.addEventListener("keydown", e => {

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = true;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = true;
    }

    if (
        e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w"
    ) {
        keys.boost = true;
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "p") {
        togglePause();
    }
});

window.addEventListener("keyup", e => {

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = false;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = false;
    }

    if (
        e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w"
    ) {
        keys.boost = false;
    }
});

/* Mobile buttons */

function holdButton(button, property) {

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[property] = true;
    });

    button.addEventListener("pointerup", e => {
        e.preventDefault();
        keys[property] = false;
    });

    button.addEventListener("pointerleave", () => {
        keys[property] = false;
    });

    button.addEventListener("pointercancel", () => {
        keys[property] = false;
    });
}

holdButton(leftBtn, "left");
holdButton(rightBtn, "right");
holdButton(boostBtn, "boost");

/* =========================================================
   Player
   ========================================================= */

const player = {
    x: W / 2,
    y: H - 115,

    vx: 0,

    width: 46,
    height: 72,

    tilt: 0,

    invincible: 0
};

/* =========================================================
   Stars
   ========================================================= */

const stars = [];

function createStars() {

    stars.length = 0;

    const count = Math.floor((W * H) / 8500);

    for (let i = 0; i < count; i++) {

        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 0.4,
            speed: Math.random() * 0.7 + 0.2,
            alpha: Math.random() * 0.7 + 0.2,
            phase: Math.random() * Math.PI * 2
        });
    }
}

createStars();

/* =========================================================
   Nebula particles
   ========================================================= */

const nebula = [];

for (let i = 0; i < 18; i++) {

    nebula.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 80 + Math.random() * 180,
        hue: Math.random() > 0.5 ? 210 : 280,
        alpha: 0.025 + Math.random() * 0.04
    });
}

/* =========================================================
   Asteroids
   ========================================================= */

const asteroids = [];

function spawnAsteroid() {

    const radius = 16 + Math.random() * 25;

    asteroids.push({
        x: radius + Math.random() * (W - radius * 2),
        y: -radius - 20,

        radius,

        vx: (Math.random() - 0.5) * 1.8,
        vy: speed + Math.random() * 2.2,

        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.04,

        points: createRockPoints(8)
    });
}

function createRockPoints(count) {

    const result = [];

    for (let i = 0; i < count; i++) {

        const angle = (Math.PI * 2 * i) / count;

        const radius =
            0.78 +
            Math.random() * 0.25;

        result.push({
            angle,
            radius
        });
    }

    return result;
}

/* =========================================================
   Crystals
   ========================================================= */

const crystals = [];

function spawnCrystal() {

    crystals.push({
        x: 35 + Math.random() * (W - 70),
        y: -30,

        size: 15 + Math.random() * 7,

        vy: speed * 0.82,

        rotation: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.05,

        pulse: Math.random() * Math.PI * 2
    });
}

/* =========================================================
   Particles
   ========================================================= */

const particles = [];

function createParticle(
    x,
    y,
    color,
    count = 10,
    power = 3
) {

    for (let i = 0; i < count; i++) {

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * power;

        particles.push({
            x,
            y,

            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,

            life: 1,

            size: 1 + Math.random() * 3,

            color
        });
    }
}

function createTrail() {

    particles.push({
        x: player.x + (Math.random() - 0.5) * 10,
        y: player.y + player.height * 0.42,

        vx: (Math.random() - 0.5) * 0.8,
        vy: 2 + Math.random() * 2,

        life: 0.7,

        size: 2 + Math.random() * 4,

        color: Math.random() > 0.5
            ? "#34e8ff"
            : "#8b55ff"
    });
}

/* =========================================================
   Reset
   ========================================================= */

function resetGame() {

    score = 0;
    distance = 0;
    shield = 100;

    speed = 2.8;
    difficulty = 1;

    spawnTimer = 0;
    crystalTimer = 0;

    shake = 0;

    asteroids.length = 0;
    crystals.length = 0;
    particles.length = 0;

    player.x = W / 2;
    player.y = H - 115;
    player.vx = 0;
    player.invincible = 0;

    updateHUD();
}

/* =========================================================
   Start
   ========================================================= */

function startGame() {

    resetGame();

    running = true;
    paused = false;

    startOverlay.classList.add("hidden");
    gameOverOverlay.classList.add("hidden");

    pauseBtn.textContent = "Ⅱ";

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

function gameOver() {

    running = false;

    shake = 18;

    createParticle(
        player.x,
        player.y,
        "#ff4568",
        45,
        7
    );

    const best =
        Number(localStorage.getItem("galaxyBest") || 0);

    if (score > best) {
        localStorage.setItem(
            "galaxyBest",
            score
        );
    }

    document.getElementById("finalScore").textContent =
        `${score} CRYSTALS`;

    gameOverOverlay.classList.remove("hidden");
}

function togglePause() {

    if (!running) return;

    paused = !paused;

    pauseBtn.textContent =
        paused ? "▶" : "Ⅱ";
}

/* =========================================================
   Collision
   ========================================================= */

function circleRectCollision(
    circle,
    rect
) {

    const closestX = Math.max(
        rect.x - rect.width / 2,
        Math.min(
            circle.x,
            rect.x + rect.width / 2
        )
    );

    const closestY = Math.max(
        rect.y - rect.height / 2,
        Math.min(
            circle.y,
            rect.y + rect.height / 2
        )
    );

    const dx = circle.x - closestX;
    const dy = circle.y - closestY;

    return dx * dx + dy * dy <
        circle.radius * circle.radius;
}

/* =========================================================
   Update
   ========================================================= */

function update(dt) {

    if (!running || paused) return;

    /* Speed increases slowly */

    difficulty += dt * 0.000025;

    speed += dt * 0.000035;

    speed = Math.min(speed, 9);

    distance += speed * dt * 0.035;

    /* Player movement */

    const acceleration = 0.0018 * dt;

    if (keys.left) {
        player.vx -= acceleration * 60;
    }

    if (keys.right) {
        player.vx += acceleration * 60;
    }

    player.vx *= Math.pow(0.84, dt / 16.67);

    player.vx = Math.max(
        -7,
        Math.min(7, player.vx)
    );

    player.x += player.vx * dt * 0.06;

    const margin = 30;

    if (player.x < margin) {
        player.x = margin;
        player.vx *= -0.3;
    }

    if (player.x > W - margin) {
        player.x = W - margin;
        player.vx *= -0.3;
    }

    player.tilt =
        player.vx * 0.045;

    if (keys.boost) {
        player.y -= 0.9;
    } else {
        player.y += 0.9;
    }

    player.y +=
        Math.sin(performance.now() * 0.004) * 0.08;

    player.y = Math.max(
        H - 180,
        Math.min(H - 70, player.y)
    );

    if (player.invincible > 0) {
        player.invincible -= dt;
    }

    /* Trail */

    if (Math.random() < 0.65) {
        createTrail();
    }

    /* Asteroid spawning */

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        spawnAsteroid();

        spawnTimer =
            Math.max(
                260,
                850 - difficulty * 120
            );
    }

    /* Crystal spawning */

    crystalTimer -= dt;

    if (crystalTimer <= 0) {

        spawnCrystal();

        crystalTimer = 700;
    }

    /* Asteroids */

    for (let i = asteroids.length - 1; i >= 0; i--) {

        const a = asteroids[i];

        a.x += a.vx * dt * 0.06;
        a.y += a.vy * dt * 0.06;

        a.rotation +=
            a.rotationSpeed * dt;

        if (
            a.x < a.radius ||
            a.x > W - a.radius
        ) {
            a.vx *= -1;
        }

        if (
            player.invincible <= 0 &&
            circleRectCollision(
                {
                    x: a.x,
                    y: a.y,
                    radius: a.radius
                },
                {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height
                }
            )
        ) {

            damagePlayer(a);

            asteroids.splice(i, 1);

            continue;
        }

        if (a.y > H + 100) {
            asteroids.splice(i, 1);
        }
    }

    /* Crystals */

    for (let i = crystals.length - 1; i >= 0; i--) {

        const c = crystals[i];

        c.y += c.vy * dt * 0.06;

        c.rotation +=
            c.spin * dt;

        c.pulse +=
            dt * 0.006;

        const dx =
            c.x - player.x;

        const dy =
            c.y - player.y;

        const hitDistance =
            c.size + 28;

        if (
            dx * dx + dy * dy <
            hitDistance * hitDistance
        ) {

            collectCrystal(c);

            crystals.splice(i, 1);

            continue;
        }

        if (c.y > H + 50) {
            crystals.splice(i, 1);
        }
    }

    /* Particles */

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;

        p.vy += 0.025 * dt;

        p.life -= dt * 0.0018;

        p.size *= 0.996;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    /* Screen shake */

    if (shake > 0) {
        shake *= Math.pow(0.85, dt / 16.67);

        if (shake < 0.2) {
            shake = 0;
        }
    }

    updateHUD();
}

/* =========================================================
   Damage
   ========================================================= */

function damagePlayer(asteroid) {

    shield -= 25;

    player.invincible = 900;

    shake = 15;

    createParticle(
        asteroid.x,
        asteroid.y,
        "#ff5577",
        28,
        6
    );

    if (shield <= 0) {
        shield = 0;
        gameOver();
    }
}

/* =========================================================
   Crystal collection
   ========================================================= */

function collectCrystal(c) {

    score += 10;

    createParticle(
        c.x,
        c.y,
        "#38eaff",
        24,
        5
    );
}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    distanceEl.textContent =
        Math.floor(distance);

    scoreEl.textContent =
        score;

    shieldEl.textContent =
        Math.max(0, Math.floor(shield));
}

/* =========================================================
   Background
   ========================================================= */

function drawBackground(time) {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#01030d"
    );

    gradient.addColorStop(
        0.5,
        "#06152d"
    );

    gradient.addColorStop(
        1,
        "#020714"
    );

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    /* Nebula */

    for (const n of nebula) {

        const gx =
            n.x +
            Math.sin(time * 0.00008 + n.y) * 30;

        const gy =
            n.y +
            Math.cos(time * 0.00007 + n.x) * 20;

        const g =
            ctx.createRadialGradient(
                gx,
                gy,
                0,
                gx,
                gy,
                n.r
            );

        g.addColorStop(
            0,
            `hsla(${n.hue}, 100%, 60%, ${n.alpha})`
        );

        g.addColorStop(
            1,
            `hsla(${n.hue}, 100%, 60%, 0)`
        );

        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.arc(
            gx,
            gy,
            n.r,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    /* Stars */

    for (const s of stars) {

        s.y +=
            s.speed *
            speed *
            0.02;

        if (s.y > H) {
            s.y = -5;
            s.x = Math.random() * W;
        }

        const twinkle =
            0.55 +
            Math.sin(
                time * 0.002 +
                s.phase
            ) * 0.35;

        ctx.globalAlpha =
            s.alpha * twinkle;

        ctx.fillStyle = "#dcecff";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    /* Speed lines */

    if (running && !paused) {

        for (let i = 0; i < 12; i++) {

            const x =
                (i * 137 +
                    time * 0.08) %
                W;

            const y =
                (i * 89 +
                    time * 0.15) %
                H;

            const length =
                15 + speed * 5;

            ctx.strokeStyle =
                "rgba(80,180,255,0.14)";

            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(x, y);

            ctx.lineTo(
                x,
                y + length
            );

            ctx.stroke();
        }
    }
}

/* =========================================================
   Draw Player
   ========================================================= */

function drawPlayer(time) {

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(player.tilt);

    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible / 90
        ) % 2 === 0
    ) {
        ctx.globalAlpha = 0.45;
    }

    /* Engine glow */

    const engine =
        ctx.createRadialGradient(
            0,
            40,
            0,
            0,
            40,
            38
        );

    engine.addColorStop(
        0,
        "rgba(80,240,255,0.95)"
    );

    engine.addColorStop(
        0.4,
        "rgba(40,130,255,0.45)"
    );

    engine.addColorStop(
        1,
        "rgba(30,80,255,0)"
    );

    ctx.fillStyle = engine;

    ctx.beginPath();

    ctx.arc(
        0,
        40,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Engine flame */

    const flameLength =
        22 +
        Math.random() * 16;

    const flame =
        ctx.createLinearGradient(
            0,
            20,
            0,
            20 + flameLength
        );

    flame.addColorStop(
        0,
        "#ffffff"
    );

    flame.addColorStop(
        0.25,
        "#4eeaff"
    );

    flame.addColorStop(
        1,
        "rgba(80,90,255,0)"
    );

    ctx.fillStyle = flame;

    ctx.beginPath();

    ctx.moveTo(-8, 25);
    ctx.lineTo(8, 25);
    ctx.lineTo(0, 25 + flameLength);

    ctx.closePath();

    ctx.fill();

    /* Ship wings */

    const bodyGradient =
        ctx.createLinearGradient(
            -25,
            -35,
            25,
            30
        );

    bodyGradient.addColorStop(
        0,
        "#dffaff"
    );

    bodyGradient.addColorStop(
        0.25,
        "#4ebeff"
    );

    bodyGradient.addColorStop(
        0.65,
        "#3564e8"
    );

    bodyGradient.addColorStop(
        1,
        "#161d75"
    );

    ctx.fillStyle =
        bodyGradient;

    ctx.shadowColor =
        "#32dfff";

    ctx.shadowBlur = 18;

    /* Left wing */

    ctx.beginPath();

    ctx.moveTo(-7, -5);
    ctx.lineTo(-27, 20);
    ctx.lineTo(-10, 17);
    ctx.lineTo(-3, 5);

    ctx.closePath();

    ctx.fill();

    /* Right wing */

    ctx.beginPath();

    ctx.moveTo(7, -5);
    ctx.lineTo(27, 20);
    ctx.lineTo(10, 17);
    ctx.lineTo(3, 5);

    ctx.closePath();

    ctx.fill();

    /* Main fuselage */

    ctx.beginPath();

    ctx.moveTo(0, -37);
    ctx.lineTo(13, -3);
    ctx.lineTo(9, 25);
    ctx.lineTo(0, 32);
    ctx.lineTo(-9, 25);
    ctx.lineTo(-13, -3);

    ctx.closePath();

    ctx.fill();

    /* Cockpit */

    const cockpit =
        ctx.createRadialGradient(
            -3,
            -19,
            1,
            0,
            -15,
            13
        );

    cockpit.addColorStop(
        0,
        "#ffffff"
    );

    cockpit.addColorStop(
        0.25,
        "#6df6ff"
    );

    cockpit.addColorStop(
        1,
        "#2563ce"
    );

    ctx.fillStyle =
        cockpit;

    ctx.beginPath();

    ctx.ellipse(
        0,
        -15,
        7,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Highlight */

    ctx.fillStyle =
        "rgba(255,255,255,0.7)";

    ctx.beginPath();

    ctx.ellipse(
        -3,
        -19,
        2,
        4,
        -0.4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   Draw Asteroid
   ========================================================= */

function drawAsteroid(a) {

    ctx.save();

    ctx.translate(
        a.x,
        a.y
    );

    ctx.rotate(a.rotation);

    /* Glow */

    ctx.shadowColor =
        "rgba(130,170,210,0.4)";

    ctx.shadowBlur = 18;

    /* Rock gradient */

    const g =
        ctx.createRadialGradient(
            -a.radius * 0.3,
            -a.radius * 0.4,
            1,
            0,
            0,
            a.radius
        );

    g.addColorStop(
        0,
        "#9da9bd"
    );

    g.addColorStop(
        0.45,
        "#536278"
    );

    g.addColorStop(
        1,
        "#161e2c"
    );

    ctx.fillStyle = g;

    ctx.beginPath();

    for (
        let i = 0;
        i < a.points.length;
        i++
    ) {

        const p = a.points[i];

        const x =
            Math.cos(p.angle) *
            a.radius *
            p.radius;

        const y =
            Math.sin(p.angle) *
            a.radius *
            p.radius;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.closePath();
    ctx.fill();

    /* Craters */

    ctx.shadowBlur = 0;

    for (let i = 0; i < 3; i++) {

        const angle =
            i * 2.1;

        const cx =
            Math.cos(angle) *
            a.radius *
            0.4;

        const cy =
            Math.sin(angle) *
            a.radius *
            0.4;

        ctx.fillStyle =
            "rgba(10,18,28,0.3)";

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            a.radius * 0.14,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   Draw Crystal
   ========================================================= */

function drawCrystal(c) {

    ctx.save();

    ctx.translate(
        c.x,
        c.y
    );

    ctx.rotate(c.rotation);

    const pulse =
        1 +
        Math.sin(c.pulse) *
        0.08;

    ctx.scale(
        pulse,
        pulse
    );

    /* Glow */

    ctx.shadowColor =
        "#31eaff";

    ctx.shadowBlur =
        25;

    /* Crystal */

    const g =
        ctx.createLinearGradient(
            -c.size,
            -c.size,
            c.size,
            c.size
        );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        0.2,
        "#6ff8ff"
    );

    g.addColorStop(
        0.5,
        "#238dff"
    );

    g.addColorStop(
        1,
        "#762cff"
    );

    ctx.fillStyle = g;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -c.size
    );

    ctx.lineTo(
        c.size * 0.65,
        -c.size * 0.25
    );

    ctx.lineTo(
        c.size * 0.42,
        c.size
    );

    ctx.lineTo(
        -c.size * 0.42,
        c.size
    );

    ctx.lineTo(
        -c.size * 0.65,
        -c.size * 0.25
    );

    ctx.closePath();

    ctx.fill();

    /* Crystal center */

    ctx.fillStyle =
        "rgba(255,255,255,0.35)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -c.size
    );

    ctx.lineTo(
        0,
        c.size
    );

    ctx.lineTo(
        c.size * 0.42,
        c.size
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   Draw Particles
   ========================================================= */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life);

        ctx.fillStyle =
            p.color;

        ctx.shadowColor =
            p.color;

        ctx.shadowBlur =
            10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

/* =========================================================
   Main Render
   ========================================================= */

function render(time) {

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );
    }

    drawBackground(time);

    /* Objects */

    for (const c of crystals) {
        drawCrystal(c);
    }

    for (const a of asteroids) {
        drawAsteroid(a);
    }

    drawParticles();

    drawPlayer(time);

    ctx.restore();

    /* Pause overlay */

    if (paused && running) {

        ctx.fillStyle =
            "rgba(1,5,15,0.42)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.textAlign = "center";

        ctx.fillStyle = "#ffffff";

        ctx.font =
            "900 28px Arial";

        ctx.fillText(
            "PAUSED",
            W / 2,
            H / 2
        );

        ctx.font =
            "12px Arial";

        ctx.fillStyle =
            "#7e9bc5";

        ctx.fillText(
            "PRESS P OR THE BUTTON TO CONTINUE",
            W / 2,
            H / 2 + 28
        );
    }
}

/* =========================================================
   Game Loop
   ========================================================= */

function gameLoop(time) {

    if (!running) {

        render(time);

        return;
    }

    let dt =
        time - lastTime;

    lastTime = time;

    dt = Math.min(dt, 32);

    update(dt);
    render(time);

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   Buttons
   ========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

pauseBtn.addEventListener(
    "click",
    togglePause
);

/* =========================================================
   Mouse / Touch Drag
   ========================================================= */

let dragging = false;
let dragX = 0;

canvas.addEventListener(
    "pointerdown",
    e => {

        if (!running) return;

        dragging = true;

        dragX = e.clientX;
    }
);

canvas.addEventListener(
    "pointermove",
    e => {

        if (!dragging || !running) {
            return;
        }

        const dx =
            e.clientX - dragX;

        player.x += dx * 0.9;

        player.x =
            Math.max(
                30,
                Math.min(
                    W - 30,
                    player.x
                )
            );

        dragX = e.clientX;
    }
);

window.addEventListener(
    "pointerup",
    () => {
        dragging = false;
    }
);

/* =========================================================
   Initial render
   ========================================================= */

resetGame();

render(performance.now());

</script>
