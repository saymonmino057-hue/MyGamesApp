<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #gameCanvas { background: #111; border: 5px solid #333; border-radius: 20px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { x: 200, y: 530 };
        let items = [];
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        // حالة الأزرار (واش الماوس فوقهم)
        let hoverRestart = false;
        let hoverBack = false;
        const fruits = ['🍎', '🍓', '🍌', '🍍', '🍇', '🥝', '🍉'];

        function spawnItem() {
            if (isGameOver) return;
            let isBomb = Math.random() > 0.7;
            items.push({ 
                x: Math.random() * 340 + 30, y: -60, 
                speed: 4.5 + (score / 100), 
                type: isBomb ? 'bomb' : 'fruit',
                icon: isBomb ? '💣' : fruits[Math.floor(Math.random() * fruits.length)],
                angle: Math.random() * Math.PI 
            });
        }
        setInterval(spawnItem, 500);

        canvas.addEventListener('mousemove', (e) => { 
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (!isGameOver) {
                player.x = mouseX; 
            } else {
                // تحقق واش الماوس فوق الأزرار باش نبدلو اللون
                hoverRestart = (mouseX > 125 && mouseX < 275 && mouseY > 320 && mouseY < 370);
                hoverBack = (mouseX > 125 && mouseX < 275 && mouseY > 390 && mouseY < 440);
            }
        });

        canvas.addEventListener('click', (e) => {
            if (isGameOver) {
                let rect = canvas.getBoundingClientRect();
                let clickX = e.clientX - rect.left;
                let clickY = e.clientY - rect.top;
                if (hoverRestart) {
                    score = 0; lives = 3; items = []; isGameOver = false; draw();
                }
                if (hoverBack) {
                    window.history.back();
                }
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.cursor = isGameOver ? "pointer" : "none";

            if (!isGameOver) {
                ctx.font = "70px Arial"; ctx.textAlign = "center";
                ctx.fillText("🧺", player.x, player.y);
                ctx.fillStyle = "#fff"; ctx.font = "bold 26px Arial";
                ctx.textAlign = "left"; ctx.fillText("النقاط: " + score, 30, 50);
                ctx.textAlign = "right"; ctx.fillText("الحيوات: " + "❤️".repeat(lives), 370, 50);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 400, 600);
                grad.addColorStop(0, "#4a00e0"); grad.addColorStop(1, "#8e2de2");
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 400, 600);
                ctx.fillStyle = "white"; ctx.font = "bold 50px Arial";
                ctx.textAlign = "center"; ctx.fillText("انتهت اللعبة!", 200, 200);
                ctx.font = "30px Arial"; ctx.fillText("النتيجة: " + score, 200, 260);
                
                // رسم الأزرار مع تغيير اللون عند الـ hover
                ctx.fillStyle = hoverRestart ? "#ddd" : "white";
                ctx.fillRect(125, 320, 150, 50);
                ctx.fillStyle = "#8e2de2"; ctx.font = "bold 18px Arial";
                ctx.fillText("إعادة اللعب", 200, 355);

                ctx.fillStyle = hoverBack ? "#ddd" : "white";
                ctx.fillRect(125, 390, 150, 50);
                ctx.fillStyle = "#8e2de2"; ctx.fillText("العودة للخلف", 200, 425);
            }

            if (!isGameOver) {
                items.forEach((item, i) => {
                    item.y += item.speed;
                    item.x += Math.sin(item.angle += 0.1) * 3;
                    ctx.font = "40px Arial";
                    ctx.fillText(item.icon, item.x, item.y);
                    if (item.y > player.y - 50 && Math.abs(item.x - player.x) < 60) {
                        if (item.type === 'fruit') { score += 10; items.splice(i, 1); }
                        else { lives--; items.splice(i, 1); if(lives <= 0) isGameOver = true; }
                    }
                    if (item.y > 650) items.splice(i, 1);
                });
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
